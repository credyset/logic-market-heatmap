<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logic Market Heatmap</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@500;700;800&display=swap');
    :root{--ink:#07152e;--accent:#e0fd2c;--bg:#f5f5f3;--muted:#9da8bb;--line:#26344e;--hero:#07152e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,sans-serif;transition:background .3s ease}body.pac{--ink:#2b211e;--accent:#ef6f45;--bg:#f4efe7;--muted:#cfc2bb;--line:#55433c;--hero:#2b211e}
    header{background:var(--hero);color:#fff;padding:30px max(24px,calc((100% - 1180px)/2));display:flex;align-items:flex-end;justify-content:space-between;gap:28px;transition:background .3s ease}.eyebrow{font:500 11px DM Mono;letter-spacing:.16em;color:var(--accent)}h1{font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.05em;margin:9px 0}.hero-copy{margin:0;color:var(--muted);max-width:610px}.tabs{display:flex;gap:6px;flex-shrink:0}.tab{border:1px solid #ffffff32;background:transparent;padding:11px 20px;border-radius:99px;font:700 12px DM Mono;color:#fff;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:var(--hero)}
    main{margin:0}.panel{display:none}.panel.active{display:block}.report-frame{display:block;width:100%;height:100vh;min-height:1100px;border:0;background:var(--bg)}footer{display:none}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tab{flex:1}}
  </style>
</head>
<body>
  <header><div><span class="eyebrow">LOGIC INC</span><h1>Market Heatmap</h1><p class="hero-copy">One research surface. Two distinct markets. Full evidence, trends, voices, connections, and resources for each arm.</p></div><nav class="tabs" aria-label="Heatmap sections"><button class="tab active" data-tab="agency">Agency</button><button class="tab" data-tab="pac">Pac</button><a href="viz/" class="tab" style="text-decoration:none">3D Explorer</a></nav></header>
  <main>
    <section class="panel active" id="agency">
      <iframe class="report-frame" title="Logic Agency Heatmap" src="agency/agency-heatmap-report.html"></iframe>
    </section>
    <section class="panel" id="pac">
      <iframe class="report-frame" title="Logic Pac Heatmap" src="pac/pac-heatmap-report.html"></iframe>
    </section>
  </main>
  <footer>Working research project · Counts are corpus signals, not market-size estimates.</footer>
  <script>
    function activate(name){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');document.getElementById(name).classList.add('active');document.body.classList.toggle('pac',name==='pac');history.replaceState(null,'','#'+name)}
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab)));
    if(location.hash==='#pac')activate('pac');
    document.querySelectorAll('iframe').forEach(frame=>frame.addEventListener('load',()=>{try{frame.style.height=(frame.contentDocument.documentElement.scrollHeight+12)+'px'}catch(e){}}));
  </script>
</body>
</html>
