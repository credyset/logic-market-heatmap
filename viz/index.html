<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Market Heatmap — Factory Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
  --ink: #050d1f;
  --paper: #0a0a0c;
  --accent-a: #FF600A;
  --accent-p: #E0FD2C;
  --navy: #050D1F;
  --dk: #2A2A2A;
  --muted: #6a7080;
  --panel: rgba(14, 14, 18, 0.94);
  --line: rgba(80, 100, 140, 0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: auto; }
body { background: var(--paper); color: #d8dde8; font: 14px/1.5 Poppins, sans-serif; }
canvas#scene { display: block; position: fixed; inset: 0; z-index: 0; }

.scroll-runway { position: relative; z-index: 1; pointer-events: none; }
.scroll-runway .spacer { height: 100vh; }

.hud { position: fixed; z-index: 10; pointer-events: none; }
.hud > * { pointer-events: auto; }

.top-bar {
  top: 0; left: 0; right: 0; padding: 18px 28px;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .eyebrow {
  font: 600 10px Poppins; letter-spacing: .18em; text-transform: uppercase;
  transition: color .4s;
}
.brand h1 { font: 800 26px/1 Poppins; letter-spacing: -.04em; color: white; }
body.theme-pac .brand h1 { font-family: 'DM Serif Display', serif; font-weight: 400; }
.brand .sub { font: 12px DM Mono; color: var(--muted); margin-top: 2px; }

.controls { display: flex; gap: 8px; align-items: center; }
.btn {
  font: 600 11px Poppins; text-transform: uppercase; letter-spacing: .04em;
  padding: 8px 16px; border-radius: 50px; border: 1px solid var(--line);
  background: var(--panel); color: #c9d1df; cursor: pointer; transition: all .2s;
  text-decoration: none;
}
.btn:hover { border-color: #fff; color: #fff; }
.btn.active { color: #fff; }

body.theme-all .btn.active[data-arm="all"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-p)); border-color: transparent; color: #111; }
body.theme-all .brand .eyebrow { background: linear-gradient(90deg, var(--accent-a), var(--accent-p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

body.theme-agency .btn.active[data-arm="Agency"] { background: var(--accent-a); border-color: var(--accent-a); color: #fff; }
body.theme-agency .brand .eyebrow { color: var(--accent-a); -webkit-text-fill-color: var(--accent-a); background: none; }

body.theme-pac .btn.active[data-arm="Pac"] { background: var(--accent-p); border-color: var(--accent-p); color: var(--navy); }
body.theme-pac .brand .eyebrow { color: var(--accent-p); -webkit-text-fill-color: var(--accent-p); background: none; }

/* Station label overlay */
.station-label {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 12;
  text-align: center; pointer-events: none; transition: opacity .5s;
}
.station-label.hidden { opacity: 0; }
.station-label .station-num {
  font: 600 11px DM Mono; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.station-label .station-title {
  font: 700 22px/1.2 Poppins; color: white; max-width: 560px;
  text-shadow: 0 2px 20px rgba(0,0,0,.8);
}
body.theme-pac .station-label .station-title { font-family: 'DM Serif Display', serif; font-weight: 400; }
.station-label .station-meta {
  font: 12px DM Mono; color: var(--muted); margin-top: 6px;
}

/* Info panel */
.info-panel {
  position: fixed; right: 24px; top: 70px; bottom: 24px; width: 380px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(20px); overflow-y: auto; z-index: 15;
  padding: 24px; display: none; flex-direction: column; gap: 14px;
}
.info-panel.open { display: flex; }
.info-panel .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 6px; }
.info-panel .close-btn:hover { color: white; }
.info-panel h2 { font-size: 18px; letter-spacing: -.02em; color: white; padding-right: 30px; }
.info-panel .meta { font: 11px DM Mono; color: var(--muted); }
.info-panel .stat-row { display: flex; gap: 12px; }
.info-panel .stat { flex: 1; background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px; }
.info-panel .stat strong { display: block; font-size: 20px; }
body.theme-all .info-panel .stat strong, body.theme-agency .info-panel .stat strong { color: var(--accent-a); }
body.theme-pac .info-panel .stat strong { color: var(--accent-p); }
.info-panel .stat span { font: 10px DM Mono; color: var(--muted); text-transform: uppercase; }
.info-panel .conn-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); color: #a0aab8; }
.info-panel .quote-card { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 4px; }
.info-panel .quote-card blockquote { font-size: 13px; line-height: 1.5; color: #e0e4ec; margin: 0 0 6px; font-style: italic; }
.info-panel .quote-card .attr { font: 10px DM Mono; color: var(--muted); }
.info-panel .quote-card a { text-decoration: none; }
body.theme-all .info-panel .quote-card a, body.theme-agency .info-panel .quote-card a { color: var(--accent-a); }
body.theme-pac .info-panel .quote-card a { color: var(--accent-p); }

/* Progress rail */
.progress-rail {
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
  z-index: 12; display: flex; flex-direction: column; gap: 5px;
  pointer-events: auto;
}
.rail-dot {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18); cursor: pointer; transition: all .25s;
  position: relative;
}
.rail-dot.active { transform: scale(1.5); }
body.theme-all .rail-dot.active, body.theme-agency .rail-dot.active { background: var(--accent-a); border-color: var(--accent-a); }
body.theme-pac .rail-dot.active { background: var(--accent-p); border-color: var(--accent-p); }
.rail-dot .tip {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font: 500 10px DM Mono; color: #c9d1df; white-space: nowrap; background: var(--panel);
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.rail-dot:hover .tip { opacity: 1; }

/* Scroll prompt */
.scroll-prompt {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 12;
  font: 500 12px Poppins; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 50px; padding: 10px 22px; backdrop-filter: blur(10px);
  transition: opacity .5s; display: flex; align-items: center; gap: 8px;
}
.scroll-prompt.hidden { opacity: 0; pointer-events: none; }
.scroll-arrow { animation: bounce 1.5s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

.loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--paper); transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--accent-a); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .info-panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 0; max-height: 55vh; border-radius: 16px 16px 0 0; }
  .progress-rail { display: none; }
  .station-label .station-title { font-size: 18px; max-width: 80vw; }
}
</style>
</head>
<body class="theme-all">

<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="hud top-bar">
  <div class="brand">
    <span class="eyebrow">Logic Inc</span>
    <h1>Market Heatmap</h1>
    <span class="sub">Factory Explorer</span>
  </div>
  <div class="controls">
    <button class="btn active" data-arm="all">All</button>
    <button class="btn" data-arm="Agency">Agency</button>
    <button class="btn" data-arm="Pac">Pac</button>
    <a href="../" class="btn">Table view</a>
  </div>
</div>

<div class="station-label hidden" id="stationLabel">
  <div class="station-num" id="stationNum"></div>
  <div class="station-title" id="stationTitle"></div>
  <div class="station-meta" id="stationMeta"></div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="close-btn" id="closePanel">&times;</button>
  <div id="panelContent"></div>
</div>

<div class="progress-rail" id="progressRail"></div>

<div class="scroll-prompt" id="scrollPrompt">
  <span class="scroll-arrow">&#8595;</span> Scroll to move through the factory
</div>

<canvas id="scene"></canvas>
<div class="scroll-runway" id="scrollRunway"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0c, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);

// ── Factory layout: stations along a winding conveyor path ──
const data = await fetch('data.json').then(r => r.json());
const sortedNodes = [...data.nodes].sort((a, b) => b.mentions - a.mentions);
const stationCount = sortedNodes.length;

// Build a gentle S-curve path through the factory
function buildFactoryPath(count) {
  const points = [];
  const spacing = 8;
  for (let i = 0; i <= count + 1; i++) {
    const z = -i * spacing;
    const x = Math.sin(i * 0.35) * 6;
    const y = 0.8 + Math.sin(i * 0.2) * 0.4;
    points.push(new THREE.Vector3(x, y, z));
  }
  return new THREE.CatmullRomCurve3(points);
}

const factoryPath = buildFactoryPath(stationCount);
const stationPositions = [];
for (let i = 0; i < stationCount; i++) {
  const t = (i + 1) / (stationCount + 1);
  stationPositions.push(factoryPath.getPointAt(t));
}

// ── Lighting ──
const ambient = new THREE.AmbientLight(0x1a1a2e, 0.35);
scene.add(ambient);

const overheadLight = new THREE.DirectionalLight(0xffffff, 0.2);
overheadLight.position.set(5, 20, 0);
scene.add(overheadLight);

// Accent spotlights at each station
stationPositions.forEach((pos, i) => {
  const node = sortedNodes[i];
  const color = new THREE.Color(node.color);
  const spot = new THREE.PointLight(color, 0.8, 14, 2);
  spot.position.set(pos.x, pos.y + 4, pos.z);
  scene.add(spot);
});

// ── Factory structure: floor, beams, conveyor, overhead gantry ──
const factoryGroup = new THREE.Group();
scene.add(factoryGroup);

// Floor — dark industrial concrete
const floorGeo = new THREE.PlaneGeometry(40, stationCount * 10 + 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x0e0e12, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -0.5, -(stationCount * 4));
floor.receiveShadow = true;
factoryGroup.add(floor);

// Floor grid lines
const gridMat = new THREE.LineBasicMaterial({ color: 0x1a1a24, transparent: true, opacity: 0.4 });
for (let gz = 0; gz > -(stationCount + 2) * 8; gz -= 4) {
  const pts = [new THREE.Vector3(-18, -0.49, gz), new THREE.Vector3(18, -0.49, gz)];
  factoryGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}
for (let gx = -18; gx <= 18; gx += 4) {
  const pts = [new THREE.Vector3(gx, -0.49, 10), new THREE.Vector3(gx, -0.49, -(stationCount + 2) * 8)];
  factoryGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}

// Conveyor rail — the main path
const conveyorPts = factoryPath.getPoints(200);
const conveyorGeo = new THREE.BufferGeometry().setFromPoints(conveyorPts);
const conveyorMat = new THREE.LineBasicMaterial({ color: 0x2a2a3a, linewidth: 1 });
factoryGroup.add(new THREE.Line(conveyorGeo, conveyorMat));

// Conveyor rails (two parallel lines)
const offsetRails = [0.4, -0.4];
offsetRails.forEach(offset => {
  const railPts = conveyorPts.map(p => {
    const tangent = factoryPath.getTangentAt(
      Math.min(1, Math.max(0, conveyorPts.indexOf(p) / conveyorPts.length))
    ).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
    return p.clone().add(right.multiplyScalar(offset)).setY(p.y - 0.3);
  });
  const geo = new THREE.BufferGeometry().setFromPoints(railPts);
  factoryGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x3a3a4a, transparent: true, opacity: 0.6 })));
});

// Overhead beams at each station
const beamMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.7, metalness: 0.6 });
stationPositions.forEach(pos => {
  // Vertical supports
  [-5, 5].forEach(xOff => {
    const geo = new THREE.BoxGeometry(0.15, 7, 0.15);
    const beam = new THREE.Mesh(geo, beamMat);
    beam.position.set(pos.x + xOff, 3, pos.z);
    factoryGroup.add(beam);
  });
  // Cross beam
  const crossGeo = new THREE.BoxGeometry(10.3, 0.12, 0.12);
  const cross = new THREE.Mesh(crossGeo, beamMat);
  cross.position.set(pos.x, 6.5, pos.z);
  factoryGroup.add(cross);
  // Diagonal braces
  [-1, 1].forEach(side => {
    const braceGeo = new THREE.BoxGeometry(0.08, 0.08, 3.5);
    const brace = new THREE.Mesh(braceGeo, beamMat);
    brace.position.set(pos.x + side * 4.5, 5, pos.z);
    brace.rotation.x = side * 0.4;
    factoryGroup.add(brace);
  });
});

// Station platforms (landing pads for each topic)
const platformMat = new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.8, metalness: 0.3, transparent: true, opacity: 0.8 });
stationPositions.forEach((pos, i) => {
  const radius = 1.2 + sortedNodes[i].radius * 1.5;
  const geo = new THREE.CylinderGeometry(radius, radius + 0.3, 0.08, 32);
  const platform = new THREE.Mesh(geo, platformMat);
  platform.position.set(pos.x, pos.y - 0.5, pos.z);
  platform.receiveShadow = true;
  factoryGroup.add(platform);

  // Glowing ring around platform
  const ringGeo = new THREE.RingGeometry(radius + 0.2, radius + 0.35, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(sortedNodes[i].color),
    transparent: true, opacity: 0.25, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(pos.x, pos.y - 0.45, pos.z);
  factoryGroup.add(ring);
});

// ── Gaussian splat topic clusters at stations ──
function createSplatTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, 'rgba(255,255,255,0.8)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  grad.addColorStop(0.7, 'rgba(255,255,255,0.05)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const splatTex = createSplatTexture();

function gaussRand() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * 0.33 + 0.5;
}

const nodeObjects = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

sortedNodes.forEach((node, i) => {
  const pos = stationPositions[i];
  const color = new THREE.Color(node.color);
  const count = Math.max(60, Math.round(node.radius * 400));
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const opacities = new Float32Array(count);

  for (let j = 0; j < count; j++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = node.radius * 1.5 * (0.2 + Math.random() * 0.8) * gaussRand();
    positions[j * 3]     = Math.sin(phi) * Math.cos(theta) * r;
    positions[j * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r + 0.8;
    positions[j * 3 + 2] = Math.cos(phi) * r;
    const brightness = 0.5 + Math.random() * 0.5;
    colors[j * 3]     = color.r * brightness;
    colors[j * 3 + 1] = color.g * brightness;
    colors[j * 3 + 2] = color.b * brightness;
    sizes[j] = (0.06 + Math.random() * 0.2) * node.radius * 3.5;
    opacities[j] = 0.15 + Math.random() * 0.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { splatMap: { value: splatTex }, time: { value: 0 }, highlight: { value: 0.0 } },
    vertexShader: `
      attribute float size;
      attribute float opacity;
      varying vec3 vColor;
      varying float vOpacity;
      uniform float time;
      uniform float highlight;
      void main() {
        vColor = color;
        vOpacity = opacity * (0.5 + highlight * 0.5);
        vec3 pos = position;
        float wave = sin(time * 0.4 + position.x * 2.0 + position.y * 3.0) * 0.04;
        pos += normalize(position + vec3(0.001)) * wave;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (220.0 / -mvPos.z) * (1.0 + highlight * 0.3);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D splatMap;
      varying vec3 vColor;
      varying float vOpacity;
      void main() {
        float alpha = texture2D(splatMap, gl_PointCoord).r;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(vColor, alpha * vOpacity);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  });

  const points = new THREE.Points(geo, mat);
  points.position.copy(pos);
  points.userData = { ...node, stationIndex: i };
  nodeGroup.add(points);
  nodeObjects.push(points);

  // Core glow
  const glowGeo = new THREE.SphereGeometry(node.radius * 0.15, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(pos);
  glow.position.y += 0.8;
  nodeGroup.add(glow);
});

// ── Co-occurrence connections between stations ──
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const nodeByOrigId = {};
nodeObjects.forEach(obj => nodeByOrigId[obj.userData.id] = obj);

data.edges.forEach(edge => {
  const src = nodeByOrigId[edge.source];
  const tgt = nodeByOrigId[edge.target];
  if (!src || !tgt) return;
  const a = src.position.clone(); a.y += 0.8;
  const b = tgt.position.clone(); b.y += 0.8;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  mid.y += 2 + Math.abs(a.z - b.z) * 0.05;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(30));
  const opacity = Math.min(0.25, edge.weight / 4000);
  const lineColor = new THREE.Color(src.userData.color).lerp(new THREE.Color(tgt.userData.color), 0.5);
  edgeGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: lineColor, transparent: true, opacity, blending: THREE.AdditiveBlending
  })));
});

// ── Particle dust (atmospheric) ──
const dustCount = 3000;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const factoryDepth = (stationCount + 2) * 8;
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 30;
  dustPos[i * 3 + 1] = Math.random() * 8;
  dustPos[i * 3 + 2] = -Math.random() * factoryDepth;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x2a2a3a, size: 0.03, transparent: true, opacity: 0.4
})));

// ── Scroll runway ──
const runway = document.getElementById('scrollRunway');
for (let i = 0; i < stationCount + 2; i++) {
  const div = document.createElement('div');
  div.className = 'spacer';
  runway.appendChild(div);
}

// Progress rail dots
const railEl = document.getElementById('progressRail');
sortedNodes.forEach((node, i) => {
  const dot = document.createElement('div');
  dot.className = 'rail-dot';
  const tip = document.createElement('span');
  tip.className = 'tip';
  tip.textContent = node.label.length > 36 ? node.label.slice(0, 34) + '...' : node.label;
  dot.appendChild(tip);
  dot.addEventListener('click', () => {
    const frac = (i + 1) / (stationCount + 1);
    window.scrollTo({ top: frac * (document.body.scrollHeight - innerHeight), behavior: 'smooth' });
  });
  railEl.appendChild(dot);
});

// ── Camera path (follows the factory path but offset above and behind) ──
function getCameraForStation(idx) {
  const t = (idx + 1) / (stationCount + 1);
  const pos = factoryPath.getPointAt(t);
  const tangent = factoryPath.getTangentAt(t).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

  const camPos = pos.clone()
    .add(tangent.clone().multiplyScalar(-4))
    .add(up.clone().multiplyScalar(3))
    .add(right.clone().multiplyScalar(1.5));

  const lookAt = pos.clone().add(new THREE.Vector3(0, 0.6, 0));
  return { camPos, lookAt };
}

const introPos = new THREE.Vector3(0, 6, 12);
const introLook = new THREE.Vector3(0, 0, -8);

// ── Animation state ──
let currentCamPos = introPos.clone();
let currentLookAt = introLook.clone();
let targetCamPos = introPos.clone();
let targetLookAt = introLook.clone();
let activeStation = -1;
let currentArm = 'all';

function lerpVec(a, b, t) {
  a.x += (b.x - a.x) * t;
  a.y += (b.y - a.y) * t;
  a.z += (b.z - a.z) * t;
}

// ── Scroll handler ──
const stationLabelEl = document.getElementById('stationLabel');
const stationNumEl = document.getElementById('stationNum');
const stationTitleEl = document.getElementById('stationTitle');
const stationMetaEl = document.getElementById('stationMeta');

function updateScrollTour() {
  const scrollFrac = window.scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
  const rawIdx = Math.round(scrollFrac * (stationCount + 1)) - 1;
  const idx = Math.max(-1, Math.min(stationCount - 1, rawIdx));

  if (idx !== activeStation) {
    activeStation = idx;

    railEl.querySelectorAll('.rail-dot').forEach((dot, i) => dot.classList.toggle('active', i === idx));

    if (idx >= 0) {
      const { camPos, lookAt } = getCameraForStation(idx);
      targetCamPos.copy(camPos);
      targetLookAt.copy(lookAt);

      const node = sortedNodes[idx];
      stationNumEl.textContent = `Station ${idx + 1} of ${stationCount} · ${node.arm}`;
      stationTitleEl.textContent = node.label;
      stationMetaEl.textContent = `${node.mentions.toLocaleString()} mentions · ${node.share}% of corpus`;
      stationLabelEl.classList.remove('hidden');

      document.getElementById('scrollPrompt').classList.add('hidden');

      // Highlight active splat
      nodeObjects.forEach(obj => {
        const isActive = obj.userData.stationIndex === idx;
        const isVisible = currentArm === 'all' || obj.userData.arm === currentArm;
        obj.material.uniforms.highlight.value = isActive ? 1.0 : 0.0;
        obj.visible = isVisible;
      });

      showPanel(node);
    } else {
      targetCamPos.copy(introPos);
      targetLookAt.copy(introLook);
      stationLabelEl.classList.add('hidden');
      nodeObjects.forEach(obj => {
        obj.material.uniforms.highlight.value = 0.0;
        obj.visible = currentArm === 'all' || obj.userData.arm === currentArm;
      });
      hidePanel();
    }
  }
}

window.addEventListener('scroll', updateScrollTour, { passive: true });

// ── Panel ──
const infoPanel = document.getElementById('infoPanel');
const panelContent = document.getElementById('panelContent');
document.getElementById('closePanel').addEventListener('click', hidePanel);

function showPanel(node) {
  const edges = data.edges.filter(e => e.source === node.id || e.target === node.id)
    .sort((a, b) => b.weight - a.weight).slice(0, 8);
  const quotes = data.quotes.filter(q => {
    const nl = node.label.toLowerCase();
    return q.category.toLowerCase().includes(node.arm.toLowerCase()) ||
      nl.includes(q.category.toLowerCase().split(' ')[0]);
  }).slice(0, 3);

  let html = `<h2>${node.label}</h2>`;
  html += `<div class="meta">${node.arm} · ${node.parent}</div>`;
  html += `<div class="stat-row">
    <div class="stat"><strong>${node.mentions.toLocaleString()}</strong><span>Mentions</span></div>
    <div class="stat"><strong>${node.share}%</strong><span>Corpus share</span></div>
  </div>`;

  if (edges.length) {
    html += '<h3 style="font-size:13px;margin-top:10px;color:#a0aab8">Connected topics</h3>';
    edges.forEach(e => {
      const other = e.source === node.id ? e.target : e.source;
      const otherNode = data.nodes.find(n => n.id === other);
      if (otherNode) html += `<div class="conn-item">${otherNode.label} <span style="float:right;color:var(--muted)">${e.weight.toLocaleString()}</span></div>`;
    });
  }

  if (quotes.length) {
    html += '<h3 style="font-size:13px;margin-top:10px;color:#a0aab8">Related evidence</h3>';
    quotes.forEach(q => {
      html += `<div class="quote-card"><blockquote>"${q.quote}"</blockquote><div class="attr"><b>${q.speaker}</b> · ${q.title} · ${q.company}<br>${q.podcast} · <a href="${q.url}" target="_blank">${q.episode}</a></div></div>`;
    });
  }

  panelContent.innerHTML = html;
  infoPanel.classList.add('open');
}

function hidePanel() { infoPanel.classList.remove('open'); }

// ── Arm filter ──
function setArm(arm) {
  currentArm = arm;
  document.querySelectorAll('.btn[data-arm]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn[data-arm="${arm}"]`).classList.add('active');
  document.body.className = arm === 'all' ? 'theme-all' : arm === 'Agency' ? 'theme-agency' : 'theme-pac';

  nodeObjects.forEach(obj => {
    obj.visible = arm === 'all' || obj.userData.arm === arm;
  });
  edgeGroup.children.forEach(line => {
    const src = nodeByOrigId[line.userData?.source];
    const tgt = nodeByOrigId[line.userData?.target];
    if (src && tgt) line.visible = src.visible && tgt.visible;
  });

  const fogColor = arm === 'Agency' ? 0x0c0c0e : arm === 'Pac' ? 0x050a14 : 0x0a0a0c;
  scene.fog = new THREE.FogExp2(fogColor, 0.018);
  renderer.setClearColor(fogColor, 1);

  if (activeStation >= 0) updateScrollTour();
}

document.querySelectorAll('.btn[data-arm]').forEach(btn => {
  btn.addEventListener('click', () => setArm(btn.dataset.arm));
});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate ──
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // Smooth camera
  const smoothing = 0.04;
  lerpVec(currentCamPos, targetCamPos, smoothing);
  lerpVec(currentLookAt, targetLookAt, smoothing);
  camera.position.copy(currentCamPos);
  camera.lookAt(currentLookAt);

  // Animate splats
  nodeObjects.forEach(obj => {
    obj.material.uniforms.time.value = t;
  });

  // Animate platform rings (pulse)
  factoryGroup.children.forEach(child => {
    if (child.geometry?.type === 'RingGeometry' && child.material.opacity !== undefined) {
      child.material.opacity = 0.15 + Math.sin(t * 1.5) * 0.1;
    }
  });

  renderer.render(scene, camera);
}

document.getElementById('loading').classList.add('done');
animate();
</script>
</body>
</html>
