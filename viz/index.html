<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Market Heatmap — Factory Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
  --accent-a: #FF600A;
  --accent-a-dk: #E55509;
  --accent-p: #E0FD2C;
  --accent-p-dk: #C8E820;
  --navy: #050D1F;
  --dk: #2A2A2A;
  --muted: #6a7080;
  --panel: rgba(10, 10, 14, 0.94);
  --line: rgba(80, 100, 140, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: auto; }
body { background: #060608; color: #d8dde8; font: 14px/1.5 Poppins, sans-serif; }
canvas#scene { display: block; position: fixed; inset: 0; z-index: 0; }

.scroll-runway { position: relative; z-index: 1; pointer-events: none; }
.scroll-runway .spacer { height: 100vh; }

.hud { position: fixed; z-index: 10; pointer-events: none; }
.hud > * { pointer-events: auto; }

.top-bar {
  top: 0; left: 0; right: 0; padding: 18px 28px;
  display: flex; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(180deg, rgba(6,6,8,.85) 0%, transparent 100%);
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .eyebrow {
  font: 600 10px Poppins; letter-spacing: .18em; text-transform: uppercase;
  transition: all .4s;
}
.brand h1 { font: 800 26px/1 Poppins; letter-spacing: -.04em; color: white; transition: font-family .3s; }
body.theme-pac .brand h1 { font-family: 'DM Serif Display', serif; font-weight: 400; }
.brand .sub { font: 12px DM Mono; color: var(--muted); margin-top: 2px; }

.controls { display: flex; gap: 8px; align-items: center; }
.btn {
  font: 600 11px Poppins; text-transform: uppercase; letter-spacing: .04em;
  padding: 8px 16px; border-radius: 50px; border: 1px solid var(--line);
  background: var(--panel); color: #c9d1df; cursor: pointer; transition: all .2s;
  text-decoration: none;
}
.btn:hover { border-color: #fff; color: #fff; }
.btn.active { color: #fff; }

body.theme-all .btn.active[data-arm="all"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-p)); border-color: transparent; color: #111; }
body.theme-all .brand .eyebrow { background: linear-gradient(90deg, var(--accent-a), var(--accent-p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

body.theme-agency .btn.active[data-arm="Agency"] { background: var(--accent-a); border-color: var(--accent-a); color: #fff; }
body.theme-agency .brand .eyebrow { color: var(--accent-a); -webkit-text-fill-color: var(--accent-a); background: none; }

body.theme-pac .btn.active[data-arm="Pac"] { background: var(--accent-p); border-color: var(--accent-p); color: var(--navy); }
body.theme-pac .brand .eyebrow { color: var(--accent-p); -webkit-text-fill-color: var(--accent-p); background: none; }

/* Station label */
.station-label {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 12;
  text-align: center; pointer-events: none; transition: opacity .5s;
}
.station-label.hidden { opacity: 0; }
.station-label .station-num {
  font: 600 11px DM Mono; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.station-label .station-title {
  font: 700 22px/1.2 Poppins; color: white; max-width: 560px;
  text-shadow: 0 2px 30px rgba(0,0,0,.9);
}
body.theme-pac .station-label .station-title { font-family: 'DM Serif Display', serif; font-weight: 400; }
.station-label .station-meta { font: 12px DM Mono; color: var(--muted); margin-top: 6px; }

/* Info panel */
.info-panel {
  position: fixed; right: 24px; top: 70px; bottom: 24px; width: 380px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(24px); overflow-y: auto; z-index: 15;
  padding: 24px; display: none; flex-direction: column; gap: 14px;
}
.info-panel.open { display: flex; }
.info-panel .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 6px; }
.info-panel .close-btn:hover { color: white; }
.info-panel h2 { font-size: 18px; letter-spacing: -.02em; color: white; padding-right: 30px; }
.info-panel .meta { font: 11px DM Mono; color: var(--muted); }
.info-panel .stat-row { display: flex; gap: 12px; }
.info-panel .stat { flex: 1; background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px; }
.info-panel .stat strong { display: block; font-size: 20px; }
body.theme-all .info-panel .stat strong, body.theme-agency .info-panel .stat strong { color: var(--accent-a); }
body.theme-pac .info-panel .stat strong { color: var(--accent-p); }
.info-panel .stat span { font: 10px DM Mono; color: var(--muted); text-transform: uppercase; }
.info-panel .conn-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); color: #a0aab8; }
.info-panel .quote-card { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 4px; }
.info-panel .quote-card blockquote { font-size: 13px; line-height: 1.5; color: #e0e4ec; margin: 0 0 6px; font-style: italic; }
.info-panel .quote-card .attr { font: 10px DM Mono; color: var(--muted); }
.info-panel .quote-card a { text-decoration: none; }
body.theme-all .info-panel .quote-card a, body.theme-agency .info-panel .quote-card a { color: var(--accent-a); }
body.theme-pac .info-panel .quote-card a { color: var(--accent-p); }

/* Progress rail */
.progress-rail {
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
  z-index: 12; display: flex; flex-direction: column; gap: 5px; pointer-events: auto;
}
.rail-dot {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18); cursor: pointer; transition: all .25s;
  position: relative;
}
.rail-dot.active { transform: scale(1.5); }
body.theme-all .rail-dot.active, body.theme-agency .rail-dot.active { background: var(--accent-a); border-color: var(--accent-a); }
body.theme-pac .rail-dot.active { background: var(--accent-p); border-color: var(--accent-p); }
.rail-dot .tip {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font: 500 10px DM Mono; color: #c9d1df; white-space: nowrap; background: var(--panel);
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.rail-dot:hover .tip { opacity: 1; }

.scroll-prompt {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 12;
  font: 500 12px Poppins; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 50px; padding: 10px 22px; backdrop-filter: blur(10px);
  transition: opacity .5s; display: flex; align-items: center; gap: 8px;
}
.scroll-prompt.hidden { opacity: 0; pointer-events: none; }
.scroll-arrow { animation: bounce 1.5s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

.loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #060608; transition: opacity .8s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--accent-a); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .info-panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 0; max-height: 55vh; border-radius: 16px 16px 0 0; }
  .progress-rail { display: none; }
  .station-label .station-title { font-size: 18px; max-width: 80vw; }
}
</style>
</head>
<body class="theme-all">

<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="hud top-bar">
  <div class="brand">
    <span class="eyebrow">Logic Inc</span>
    <h1>Market Heatmap</h1>
    <span class="sub">Factory Explorer</span>
  </div>
  <div class="controls">
    <button class="btn active" data-arm="all">All</button>
    <button class="btn" data-arm="Agency">Agency</button>
    <button class="btn" data-arm="Pac">Pac</button>
    <a href="../" class="btn">Table view</a>
  </div>
</div>

<div class="station-label hidden" id="stationLabel">
  <div class="station-num" id="stationNum"></div>
  <div class="station-title" id="stationTitle"></div>
  <div class="station-meta" id="stationMeta"></div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="close-btn" id="closePanel">&times;</button>
  <div id="panelContent"></div>
</div>

<div class="progress-rail" id="progressRail"></div>

<div class="scroll-prompt" id="scrollPrompt">
  <span class="scroll-arrow">&#8595;</span> Scroll to move through the factory
</div>

<canvas id="scene"></canvas>
<div class="scroll-runway" id="scrollRunway"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060608, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060608, 0.012);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 400);

// Post-processing: bloom for that futuristic glow
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.85);
composer.addPass(bloomPass);

// ── Data ──
const data = await fetch('data.json').then(r => r.json());
const sortedNodes = [...data.nodes].sort((a, b) => b.mentions - a.mentions);
const N = sortedNodes.length;

// ── Factory path: a gentle helix through a long hall ──
function buildPath(count) {
  const pts = [];
  const spacing = 10;
  for (let i = 0; i <= count + 2; i++) {
    const z = -i * spacing;
    const x = Math.sin(i * 0.28) * 7;
    const y = 0.6 + Math.sin(i * 0.15) * 0.3;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return new THREE.CatmullRomCurve3(pts);
}

const path = buildPath(N);
const stationPos = [];
for (let i = 0; i < N; i++) {
  const t = (i + 1) / (N + 2);
  stationPos.push(path.getPointAt(t));
}

// ── Lighting: dramatic and moody ──
scene.add(new THREE.AmbientLight(0x0a0a1a, 0.2));

// Overhead industrial light strip (volumetric feel)
const stripLight = new THREE.RectAreaLight(0x1a1a2e, 2, 2, N * 10 + 20);
stripLight.position.set(0, 12, -(N * 5));
stripLight.lookAt(0, 0, -(N * 5));
scene.add(stripLight);

// Accent spotlights at stations with cones
const spotLights = [];
stationPos.forEach((pos, i) => {
  const node = sortedNodes[i];
  const color = new THREE.Color(node.color);

  // Main station spotlight from above
  const spot = new THREE.SpotLight(color, 2.5, 18, Math.PI / 5, 0.6, 2);
  spot.position.set(pos.x, pos.y + 9, pos.z);
  spot.target.position.copy(pos);
  scene.add(spot);
  scene.add(spot.target);
  spotLights.push(spot);

  // Softer fill from the side
  const fill = new THREE.PointLight(color, 0.3, 12, 2);
  fill.position.set(pos.x + 3, pos.y + 2, pos.z);
  scene.add(fill);
});

// ── Factory structure ──
const factoryG = new THREE.Group();
scene.add(factoryG);

const factoryLen = (N + 3) * 10;
const halfLen = factoryLen / 2;

// Reflective floor
const floorGeo = new THREE.PlaneGeometry(50, factoryLen);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x080810, roughness: 0.3, metalness: 0.8,
  envMapIntensity: 0.4
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -0.5, -halfLen + 15);
factoryG.add(floor);

// Floor grid — neon-edged
const gridMat = new THREE.LineBasicMaterial({ color: 0x12121e, transparent: true, opacity: 0.5 });
const gridAccentMat = new THREE.LineBasicMaterial({ color: 0x1a1a30, transparent: true, opacity: 0.35 });
for (let gz = 10; gz > -factoryLen; gz -= 3) {
  factoryG.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-22, -0.48, gz), new THREE.Vector3(22, -0.48, gz)]),
    gz % 9 === 0 ? gridAccentMat : gridMat
  ));
}
for (let gx = -22; gx <= 22; gx += 3) {
  factoryG.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(gx, -0.48, 12), new THREE.Vector3(gx, -0.48, -factoryLen)]),
    gx % 9 === 0 ? gridAccentMat : gridMat
  ));
}

// Walls — tall dark panels with subtle stripe lighting
const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.85, metalness: 0.4 });
[-16, 16].forEach(x => {
  const wallGeo = new THREE.BoxGeometry(0.3, 14, factoryLen);
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(x, 6.5, -halfLen + 15);
  factoryG.add(wall);

  // Wall accent lights — horizontal neon strips
  for (let wz = 5; wz > -factoryLen + 5; wz -= 20) {
    const stripGeo = new THREE.BoxGeometry(0.05, 0.05, 16);
    const stripMat = new THREE.MeshBasicMaterial({ color: 0x1a1a3a, transparent: true, opacity: 0.5 });
    const strip = new THREE.Mesh(stripGeo, stripMat);
    strip.position.set(x + (x > 0 ? -0.2 : 0.2), 4 + (wz % 40 === 0 ? 4 : 0), wz);
    factoryG.add(strip);
  }
});

// Ceiling
const ceilGeo = new THREE.PlaneGeometry(32, factoryLen);
const ceilMat = new THREE.MeshStandardMaterial({ color: 0x06060a, roughness: 0.95, metalness: 0.2 });
const ceil = new THREE.Mesh(ceilGeo, ceilMat);
ceil.rotation.x = Math.PI / 2;
ceil.position.set(0, 13.5, -halfLen + 15);
factoryG.add(ceil);

// Overhead pipe networks
const pipeMat = new THREE.MeshStandardMaterial({ color: 0x18181e, roughness: 0.5, metalness: 0.7 });
const pipeAccentMat = new THREE.MeshBasicMaterial({ color: 0x1e2238, transparent: true, opacity: 0.6 });
[-10, -4, 4, 10].forEach(x => {
  const pipeGeo = new THREE.CylinderGeometry(0.08, 0.08, factoryLen, 8);
  const pipe = new THREE.Mesh(pipeGeo, pipeMat);
  pipe.rotation.x = Math.PI / 2;
  pipe.position.set(x, 11 + Math.abs(x) * 0.1, -halfLen + 15);
  factoryG.add(pipe);
});

// Cross pipes at intervals
for (let cz = 5; cz > -factoryLen; cz -= 15) {
  const crossGeo = new THREE.CylinderGeometry(0.06, 0.06, 20, 8);
  const cross = new THREE.Mesh(crossGeo, pipeMat);
  cross.rotation.z = Math.PI / 2;
  cross.position.set(0, 11.5, cz);
  factoryG.add(cross);
}

// Conveyor rail — glowing main path
const convPts = path.getPoints(400);
const convGeo = new THREE.BufferGeometry().setFromPoints(convPts);
factoryG.add(new THREE.Line(convGeo, new THREE.LineBasicMaterial({ color: 0x2a2a44, transparent: true, opacity: 0.7 })));

// Conveyor side rails
const beamMat = new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.6, metalness: 0.7 });
[0.6, -0.6].forEach(offset => {
  const railPts = [];
  for (let ri = 0; ri <= 400; ri++) {
    const t = ri / 400;
    const p = path.getPointAt(t);
    const tan = path.getTangentAt(t).normalize();
    const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize();
    railPts.push(p.clone().add(right.multiplyScalar(offset)).setY(p.y - 0.35));
  }
  factoryG.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(railPts),
    new THREE.LineBasicMaterial({ color: 0x22222e, transparent: true, opacity: 0.5 })
  ));
});

// ── Station structures: industrial bays ──
stationPos.forEach((pos, i) => {
  const node = sortedNodes[i];
  const stationColor = new THREE.Color(node.color);
  const r = 1.5 + node.radius * 1.8;

  // Tall vertical supports (I-beams)
  [-6, 6].forEach(xOff => {
    const colGeo = new THREE.BoxGeometry(0.18, 12, 0.18);
    const col = new THREE.Mesh(colGeo, beamMat);
    col.position.set(pos.x + xOff, 5.5, pos.z);
    factoryG.add(col);

    // Bracket to overhead pipes
    const bracketGeo = new THREE.BoxGeometry(0.08, 0.08, 2);
    const bracket = new THREE.Mesh(bracketGeo, beamMat);
    bracket.position.set(pos.x + xOff, 10, pos.z);
    bracket.rotation.x = xOff > 0 ? 0.5 : -0.5;
    factoryG.add(bracket);
  });

  // Cross gantry
  const gantryGeo = new THREE.BoxGeometry(12.5, 0.14, 0.14);
  const gantry = new THREE.Mesh(gantryGeo, beamMat);
  gantry.position.set(pos.x, 11.5, pos.z);
  factoryG.add(gantry);

  // Catwalk railings
  [-5.5, 5.5].forEach(xOff => {
    const railGeo = new THREE.BoxGeometry(0.04, 1.2, 3);
    const rail = new THREE.Mesh(railGeo, new THREE.MeshStandardMaterial({
      color: 0x161620, roughness: 0.6, metalness: 0.5, transparent: true, opacity: 0.7
    }));
    rail.position.set(pos.x + xOff, 9.5, pos.z);
    factoryG.add(rail);
  });

  // Platform — hexagonal, industrial
  const platGeo = new THREE.CylinderGeometry(r, r + 0.4, 0.12, 6);
  const platMat = new THREE.MeshStandardMaterial({ color: 0x0c0c14, roughness: 0.7, metalness: 0.5 });
  const plat = new THREE.Mesh(platGeo, platMat);
  plat.position.set(pos.x, pos.y - 0.5, pos.z);
  factoryG.add(plat);

  // Glowing ring around platform
  const ringGeo = new THREE.RingGeometry(r + 0.3, r + 0.5, 6);
  const ringMat = new THREE.MeshBasicMaterial({
    color: stationColor, transparent: true, opacity: 0.35, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(pos.x, pos.y - 0.43, pos.z);
  ring.userData = { isRing: true };
  factoryG.add(ring);

  // Inner ring (brighter, smaller)
  const innerRingGeo = new THREE.RingGeometry(r * 0.3, r * 0.35, 32);
  const innerRing = new THREE.Mesh(innerRingGeo, new THREE.MeshBasicMaterial({
    color: stationColor, transparent: true, opacity: 0.5, side: THREE.DoubleSide
  }));
  innerRing.rotation.x = -Math.PI / 2;
  innerRing.position.set(pos.x, pos.y - 0.42, pos.z);
  innerRing.userData = { isRing: true };
  factoryG.add(innerRing);

  // Vertical light bar (holographic accent)
  const barGeo = new THREE.BoxGeometry(0.04, 3, 0.04);
  const barMat = new THREE.MeshBasicMaterial({ color: stationColor, transparent: true, opacity: 0.3 });
  [-1, 1].forEach(side => {
    const bar = new THREE.Mesh(barGeo, barMat);
    bar.position.set(pos.x + side * (r + 0.8), pos.y + 1, pos.z);
    factoryG.add(bar);
  });

  // Robotic arm silhouette (decorative geometry near larger stations)
  if (node.radius > 0.5) {
    const armBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.2, 0.5, 8),
      new THREE.MeshStandardMaterial({ color: 0x16161e, metalness: 0.8, roughness: 0.4 })
    );
    armBase.position.set(pos.x + (i % 2 ? 3 : -3), pos.y - 0.25, pos.z + 1.5);
    factoryG.add(armBase);

    const armSeg1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 2, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x1e1e28, metalness: 0.7, roughness: 0.5 })
    );
    armSeg1.position.set(pos.x + (i % 2 ? 3 : -3), pos.y + 0.75, pos.z + 1.5);
    armSeg1.rotation.z = (i % 2 ? 0.3 : -0.3);
    factoryG.add(armSeg1);

    const armSeg2 = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 1.4, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x22222e, metalness: 0.6, roughness: 0.5 })
    );
    armSeg2.position.set(pos.x + (i % 2 ? 3.5 : -3.5), pos.y + 1.8, pos.z + 1.5);
    armSeg2.rotation.z = (i % 2 ? -0.5 : 0.5);
    factoryG.add(armSeg2);
  }
});

// ── Volumetric god ray cones at stations ──
const coneGroup = new THREE.Group();
scene.add(coneGroup);
stationPos.forEach((pos, i) => {
  const node = sortedNodes[i];
  const coneGeo = new THREE.CylinderGeometry(0.2, node.radius * 2.5, 9, 16, 1, true);
  const coneMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(node.color),
    transparent: true, opacity: 0.04, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.set(pos.x, pos.y + 4.5, pos.z);
  cone.userData = { stationIdx: i, baseOpacity: 0.04 };
  coneGroup.add(cone);
});

// ── Gaussian splat topic clusters ──
function createSplatTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.12, 'rgba(255,255,255,0.85)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.3)');
  grad.addColorStop(0.65, 'rgba(255,255,255,0.06)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const splatTex = createSplatTexture();

function gaussRand() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * 0.33 + 0.5;
}

const nodeObjects = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

sortedNodes.forEach((node, i) => {
  const pos = stationPos[i];
  const color = new THREE.Color(node.color);
  const count = Math.max(80, Math.round(node.radius * 500));
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const opacities = new Float32Array(count);

  for (let j = 0; j < count; j++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = node.radius * 1.8 * (0.15 + Math.random() * 0.85) * gaussRand();
    positions[j * 3]     = Math.sin(phi) * Math.cos(theta) * r;
    positions[j * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r + 1.2;
    positions[j * 3 + 2] = Math.cos(phi) * r;
    const b = 0.4 + Math.random() * 0.6;
    colors[j * 3] = color.r * b;
    colors[j * 3 + 1] = color.g * b;
    colors[j * 3 + 2] = color.b * b;
    sizes[j] = (0.05 + Math.random() * 0.22) * node.radius * 4;
    opacities[j] = 0.12 + Math.random() * 0.55;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { splatMap: { value: splatTex }, time: { value: 0 }, highlight: { value: 0.0 } },
    vertexShader: `
      attribute float size;
      attribute float opacity;
      varying vec3 vColor;
      varying float vOpacity;
      uniform float time;
      uniform float highlight;
      void main() {
        vColor = color;
        vOpacity = opacity * (0.45 + highlight * 0.55);
        vec3 pos = position;
        float wave = sin(time * 0.35 + position.x * 2.5 + position.y * 3.5) * 0.05;
        pos += normalize(position + vec3(0.001)) * wave;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (240.0 / -mvPos.z) * (1.0 + highlight * 0.4);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D splatMap;
      varying vec3 vColor;
      varying float vOpacity;
      void main() {
        float alpha = texture2D(splatMap, gl_PointCoord).r;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(vColor, alpha * vOpacity);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  });

  const points = new THREE.Points(geo, mat);
  points.position.copy(pos);
  points.userData = { ...node, stationIndex: i };
  nodeGroup.add(points);
  nodeObjects.push(points);

  // Core glow orb
  const glowGeo = new THREE.SphereGeometry(node.radius * 0.18, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(pos);
  glow.position.y += 1.2;
  nodeGroup.add(glow);
});

// ── Co-occurrence arcs ──
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const nodeByOrigId = {};
nodeObjects.forEach(obj => nodeByOrigId[obj.userData.id] = obj);

data.edges.forEach(edge => {
  const src = nodeByOrigId[edge.source];
  const tgt = nodeByOrigId[edge.target];
  if (!src || !tgt) return;
  const a = src.position.clone(); a.y += 1.2;
  const b = tgt.position.clone(); b.y += 1.2;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  mid.y += 3 + Math.abs(a.z - b.z) * 0.04;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
  const opacity = Math.min(0.2, edge.weight / 5000);
  const lineColor = new THREE.Color(src.userData.color).lerp(new THREE.Color(tgt.userData.color), 0.5);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: lineColor, transparent: true, opacity, blending: THREE.AdditiveBlending
  }));
  line.userData = edge;
  edgeGroup.add(line);
});

// ── Atmospheric particles: dust, sparks, floating embers ──
const dustCount = 5000;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
const dustSizes = new Float32Array(dustCount);
const dustColors = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPositions[i * 3]     = (Math.random() - 0.5) * 35;
  dustPositions[i * 3 + 1] = Math.random() * 12;
  dustPositions[i * 3 + 2] = -Math.random() * factoryLen;
  dustSizes[i] = 0.02 + Math.random() * 0.06;
  const warmth = Math.random();
  dustColors[i * 3]     = 0.15 + warmth * 0.1;
  dustColors[i * 3 + 1] = 0.12 + warmth * 0.05;
  dustColors[i * 3 + 2] = 0.18 + warmth * 0.02;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
dustGeo.setAttribute('size', new THREE.BufferAttribute(dustSizes, 1));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float time;
    void main() {
      vColor = color;
      vec3 p = position;
      p.y += sin(time * 0.3 + position.x * 0.5 + position.z * 0.3) * 0.15;
      p.x += sin(time * 0.15 + position.z * 0.2) * 0.1;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float alpha = (1.0 - d * d) * 0.4;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true
});
scene.add(new THREE.Points(dustGeo, dustMat));

// Conveyor particles (moving along the path)
const convParticleCount = 200;
const convParticleGeo = new THREE.BufferGeometry();
const convParticlePos = new Float32Array(convParticleCount * 3);
const convParticleSpeeds = new Float32Array(convParticleCount);
for (let i = 0; i < convParticleCount; i++) {
  convParticleSpeeds[i] = 0.002 + Math.random() * 0.004;
  const t = Math.random();
  const p = path.getPointAt(t);
  convParticlePos[i * 3] = p.x + (Math.random() - 0.5) * 0.8;
  convParticlePos[i * 3 + 1] = p.y - 0.3;
  convParticlePos[i * 3 + 2] = p.z;
}
convParticleGeo.setAttribute('position', new THREE.BufferAttribute(convParticlePos, 3));
const convParticleMat = new THREE.PointsMaterial({
  color: 0x3a3a5a, size: 0.06, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
});
const convParticles = new THREE.Points(convParticleGeo, convParticleMat);
convParticles.userData = { speeds: convParticleSpeeds, offsets: new Float32Array(convParticleCount).map(() => Math.random()) };
scene.add(convParticles);

// ── Scroll runway ──
const runway = document.getElementById('scrollRunway');
for (let i = 0; i < N + 2; i++) {
  const div = document.createElement('div');
  div.className = 'spacer';
  runway.appendChild(div);
}

const railEl = document.getElementById('progressRail');
sortedNodes.forEach((node, i) => {
  const dot = document.createElement('div');
  dot.className = 'rail-dot';
  const tip = document.createElement('span');
  tip.className = 'tip';
  tip.textContent = node.label.length > 36 ? node.label.slice(0, 34) + '...' : node.label;
  dot.appendChild(tip);
  dot.addEventListener('click', () => {
    window.scrollTo({ top: ((i + 1) / (N + 1)) * (document.body.scrollHeight - innerHeight), behavior: 'smooth' });
  });
  railEl.appendChild(dot);
});

// ── Camera ──
function getCamForStation(idx) {
  const t = (idx + 1) / (N + 2);
  const pos = path.getPointAt(t);
  const tan = path.getTangentAt(t).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(tan, up).normalize();
  return {
    camPos: pos.clone().add(tan.clone().multiplyScalar(-5)).add(up.clone().multiplyScalar(3.5)).add(right.clone().multiplyScalar(2)),
    lookAt: pos.clone().add(new THREE.Vector3(0, 0.8, 0))
  };
}

const introPos = new THREE.Vector3(0, 8, 16);
const introLook = new THREE.Vector3(0, 1, -12);
let curCamPos = introPos.clone();
let curLookAt = introLook.clone();
let tgtCamPos = introPos.clone();
let tgtLookAt = introLook.clone();
let activeStation = -1;
let currentArm = 'all';

function lerpV(a, b, t) { a.x += (b.x - a.x) * t; a.y += (b.y - a.y) * t; a.z += (b.z - a.z) * t; }

// ── Scroll ──
const stationLabelEl = document.getElementById('stationLabel');
const stationNumEl = document.getElementById('stationNum');
const stationTitleEl = document.getElementById('stationTitle');
const stationMetaEl = document.getElementById('stationMeta');

function updateScroll() {
  const frac = window.scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
  const rawIdx = Math.round(frac * (N + 1)) - 1;
  const idx = Math.max(-1, Math.min(N - 1, rawIdx));

  if (idx !== activeStation) {
    activeStation = idx;
    railEl.querySelectorAll('.rail-dot').forEach((dot, i) => dot.classList.toggle('active', i === idx));

    if (idx >= 0) {
      const { camPos, lookAt } = getCamForStation(idx);
      tgtCamPos.copy(camPos);
      tgtLookAt.copy(lookAt);

      const node = sortedNodes[idx];
      stationNumEl.textContent = `Station ${idx + 1} of ${N} · ${node.arm}`;
      stationTitleEl.textContent = node.label;
      stationMetaEl.textContent = `${node.mentions.toLocaleString()} mentions · ${node.share}% of corpus`;
      stationLabelEl.classList.remove('hidden');
      document.getElementById('scrollPrompt').classList.add('hidden');

      nodeObjects.forEach(obj => {
        const isActive = obj.userData.stationIndex === idx;
        obj.material.uniforms.highlight.value = isActive ? 1.0 : 0.0;
        obj.visible = currentArm === 'all' || obj.userData.arm === currentArm;
      });

      // Brighten active god ray cone
      coneGroup.children.forEach(c => {
        const isActive = c.userData.stationIdx === idx;
        c.material.opacity = isActive ? 0.12 : c.userData.baseOpacity;
      });

      showPanel(node);
    } else {
      tgtCamPos.copy(introPos);
      tgtLookAt.copy(introLook);
      stationLabelEl.classList.add('hidden');
      nodeObjects.forEach(obj => {
        obj.material.uniforms.highlight.value = 0.0;
        obj.visible = currentArm === 'all' || obj.userData.arm === currentArm;
      });
      coneGroup.children.forEach(c => c.material.opacity = c.userData.baseOpacity);
      hidePanel();
    }
  }
}

window.addEventListener('scroll', updateScroll, { passive: true });

// ── Panel ──
const infoPanel = document.getElementById('infoPanel');
const panelContent = document.getElementById('panelContent');
document.getElementById('closePanel').addEventListener('click', hidePanel);

function showPanel(node) {
  const edges = data.edges.filter(e => e.source === node.id || e.target === node.id)
    .sort((a, b) => b.weight - a.weight).slice(0, 8);
  const quotes = data.quotes.filter(q => {
    const nl = node.label.toLowerCase();
    return q.category.toLowerCase().includes(node.arm.toLowerCase()) ||
      nl.includes(q.category.toLowerCase().split(' ')[0]);
  }).slice(0, 3);

  let html = `<h2>${node.label}</h2>`;
  html += `<div class="meta">${node.arm} · ${node.parent}</div>`;
  html += `<div class="stat-row">
    <div class="stat"><strong>${node.mentions.toLocaleString()}</strong><span>Mentions</span></div>
    <div class="stat"><strong>${node.share}%</strong><span>Corpus share</span></div>
  </div>`;

  if (edges.length) {
    html += '<h3 style="font-size:13px;margin-top:10px;color:#a0aab8">Connected topics</h3>';
    edges.forEach(e => {
      const other = e.source === node.id ? e.target : e.source;
      const otherNode = data.nodes.find(n => n.id === other);
      if (otherNode) html += `<div class="conn-item">${otherNode.label} <span style="float:right;color:var(--muted)">${e.weight.toLocaleString()}</span></div>`;
    });
  }

  if (quotes.length) {
    html += '<h3 style="font-size:13px;margin-top:10px;color:#a0aab8">Related evidence</h3>';
    quotes.forEach(q => {
      html += `<div class="quote-card"><blockquote>“${q.quote}”</blockquote><div class="attr"><b>${q.speaker}</b> · ${q.title} · ${q.company}<br>${q.podcast} · <a href="${q.url}" target="_blank">${q.episode}</a></div></div>`;
    });
  }

  panelContent.innerHTML = html;
  infoPanel.classList.add('open');
}

function hidePanel() { infoPanel.classList.remove('open'); }

// ── Arm filter ──
function setArm(arm) {
  currentArm = arm;
  document.querySelectorAll('.btn[data-arm]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn[data-arm="${arm}"]`).classList.add('active');
  document.body.className = arm === 'all' ? 'theme-all' : arm === 'Agency' ? 'theme-agency' : 'theme-pac';

  const fogColor = arm === 'Agency' ? 0x0c0a08 : arm === 'Pac' ? 0x040a14 : 0x060608;
  scene.fog = new THREE.FogExp2(fogColor, 0.012);
  renderer.setClearColor(fogColor, 1);

  nodeObjects.forEach(obj => { obj.visible = arm === 'all' || obj.userData.arm === arm; });
  coneGroup.children.forEach(cone => {
    const nodeArm = sortedNodes[cone.userData.stationIdx]?.arm;
    cone.visible = arm === 'all' || nodeArm === arm;
  });
  edgeGroup.children.forEach(line => {
    const src = nodeByOrigId[line.userData?.source];
    const tgt = nodeByOrigId[line.userData?.target];
    if (src && tgt) line.visible = src.visible && tgt.visible;
  });
  spotLights.forEach((spot, i) => {
    const nodeArm = sortedNodes[i]?.arm;
    spot.visible = arm === 'all' || nodeArm === arm;
  });

  if (activeStation >= 0) updateScroll();
}

document.querySelectorAll('.btn[data-arm]').forEach(btn => {
  btn.addEventListener('click', () => setArm(btn.dataset.arm));
});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ── Animate ──
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  lerpV(curCamPos, tgtCamPos, 0.04);
  lerpV(curLookAt, tgtLookAt, 0.04);
  camera.position.copy(curCamPos);
  camera.lookAt(curLookAt);

  // Animate splats
  nodeObjects.forEach(obj => { obj.material.uniforms.time.value = t; });

  // Animate dust
  dustMat.uniforms.time.value = t;

  // Animate conveyor particles
  const cpPos = convParticles.geometry.attributes.position;
  const cpArr = cpPos.array;
  const spd = convParticles.userData.speeds;
  const off = convParticles.userData.offsets;
  for (let i = 0; i < convParticleCount; i++) {
    off[i] = (off[i] + spd[i]) % 1;
    const p = path.getPointAt(off[i]);
    cpArr[i * 3] = p.x + Math.sin(t + i) * 0.3;
    cpArr[i * 3 + 1] = p.y - 0.3;
    cpArr[i * 3 + 2] = p.z;
  }
  cpPos.needsUpdate = true;

  // Pulse platform rings
  factoryG.children.forEach(child => {
    if (child.userData?.isRing) {
      child.material.opacity = 0.2 + Math.sin(t * 1.2 + child.position.z * 0.1) * 0.15;
    }
  });

  // Pulse god ray cones gently
  coneGroup.children.forEach(c => {
    if (c.userData.stationIdx !== activeStation) {
      c.material.opacity = c.userData.baseOpacity + Math.sin(t * 0.8 + c.userData.stationIdx) * 0.015;
    }
  });

  composer.render();
}

document.getElementById('loading').classList.add('done');
animate();
</script>
</body>
</html>
