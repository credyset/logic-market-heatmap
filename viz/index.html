<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Market Heatmap — 3D Topic Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

:root {
  --ink: #050d1f;
  --paper: #020810;
  --accent-a: #e0fd2c;
  --accent-p: #ef6f45;
  --muted: #596579;
  --panel: rgba(12, 20, 40, 0.92);
  --line: rgba(80, 100, 140, 0.25);
  --hero-a: #07152e;
  --hero-p: #2b211e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: auto; }
body { background: var(--paper); color: #d8dde8; font: 14px/1.5 Manrope, sans-serif; }
canvas#scene { display: block; position: fixed; inset: 0; z-index: 0; }

/* Scroll container underneath the fixed canvas */
.scroll-runway { position: relative; z-index: 1; pointer-events: none; }
.scroll-runway .spacer { height: 100vh; }

/* HUD overlay */
.hud { position: fixed; z-index: 10; pointer-events: none; }
.hud > * { pointer-events: auto; }

.top-bar {
  top: 0; left: 0; right: 0; padding: 20px 28px;
  display: flex; justify-content: space-between; align-items: flex-start;
  transition: background .4s;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .eyebrow {
  font: 500 10px DM Mono; letter-spacing: .18em; text-transform: uppercase;
  transition: color .4s;
}
.brand h1 { font-size: 28px; letter-spacing: -.04em; line-height: 1; color: white; }
.brand .sub { font: 12px DM Mono; color: var(--muted); margin-top: 4px; transition: color .4s; }

.controls { display: flex; gap: 8px; align-items: center; }
.btn {
  font: 500 11px DM Mono; text-transform: uppercase; letter-spacing: .06em;
  padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--panel); color: #c9d1df; cursor: pointer; transition: all .2s;
}
.btn:hover { border-color: #fff; color: #fff; }
.btn.active { color: var(--paper); }

/* Theme states */
body.theme-all .btn.active[data-arm="all"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-p)); border-color: transparent; }
body.theme-all .brand .eyebrow { background: linear-gradient(90deg, var(--accent-a), var(--accent-p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
body.theme-all .brand .sub { color: #7a8899; }

body.theme-agency .btn.active[data-arm="Agency"] { background: var(--accent-a); border-color: var(--accent-a); }
body.theme-agency .brand .eyebrow { color: var(--accent-a); -webkit-text-fill-color: var(--accent-a); background: none; }
body.theme-agency .brand .sub { color: var(--accent-a); opacity: .55; }

body.theme-pac .btn.active[data-arm="Pac"] { background: var(--accent-p); border-color: var(--accent-p); }
body.theme-pac .brand .eyebrow { color: var(--accent-p); -webkit-text-fill-color: var(--accent-p); background: none; }
body.theme-pac .brand .sub { color: var(--accent-p); opacity: .55; }

/* Scroll progress indicator */
.scroll-progress {
  position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
  z-index: 15; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: auto;
}
.scroll-dot {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.2); cursor: pointer; transition: all .25s;
  position: relative;
}
.scroll-dot.active { background: var(--accent-a); border-color: var(--accent-a); transform: scale(1.4); }
body.theme-pac .scroll-dot.active { background: var(--accent-p); border-color: var(--accent-p); }
.scroll-dot .tip {
  position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
  font: 500 10px DM Mono; color: #c9d1df; white-space: nowrap; background: var(--panel);
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.scroll-dot:hover .tip { opacity: 1; }

/* Info panel */
.info-panel {
  position: fixed; right: 24px; top: 80px; bottom: 24px; width: 380px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(20px); overflow-y: auto; z-index: 15;
  padding: 24px; display: none; flex-direction: column; gap: 16px;
}
.info-panel.open { display: flex; }
.info-panel .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 6px; }
.info-panel .close-btn:hover { color: white; }
.info-panel h2 { font-size: 20px; letter-spacing: -.03em; color: white; padding-right: 30px; }
.info-panel .meta { font: 11px DM Mono; color: var(--muted); }
.info-panel .stat-row { display: flex; gap: 16px; }
.info-panel .stat { flex: 1; background: rgba(255,255,255,.04); border-radius: 10px; padding: 12px; }
.info-panel .stat strong { display: block; font-size: 22px; }
body.theme-all .info-panel .stat strong { color: var(--accent-a); }
body.theme-agency .info-panel .stat strong { color: var(--accent-a); }
body.theme-pac .info-panel .stat strong { color: var(--accent-p); }
.info-panel .stat span { font: 10px DM Mono; color: var(--muted); text-transform: uppercase; }
.info-panel .connections { margin-top: 8px; }
.info-panel .conn-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); color: #a0aab8; }
.info-panel .quote-card { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 6px; }
.info-panel .quote-card blockquote { font-size: 14px; line-height: 1.5; color: #e0e4ec; margin: 0 0 8px; font-style: italic; }
.info-panel .quote-card .attr { font: 10px DM Mono; color: var(--muted); }
.info-panel .quote-card a { text-decoration: none; }
body.theme-all .info-panel .quote-card a { color: var(--accent-a); }
body.theme-agency .info-panel .quote-card a { color: var(--accent-a); }
body.theme-pac .info-panel .quote-card a { color: var(--accent-p); }

/* Legend */
.legend {
  position: fixed; left: 24px; bottom: 24px; z-index: 10;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 18px; backdrop-filter: blur(15px);
}
.legend h3 { font: 500 10px DM Mono; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
.legend-items { display: flex; flex-direction: column; gap: 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #a0aab8; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Scroll prompt */
.scroll-prompt {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
  font: 11px DM Mono; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 99px; padding: 8px 18px; backdrop-filter: blur(10px);
  transition: opacity .5s; opacity: 1; display: flex; align-items: center; gap: 8px;
}
.scroll-prompt.hidden { opacity: 0; pointer-events: none; }
.scroll-arrow { animation: bounce 1.5s infinite; display: inline-block; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* Loading */
.loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--paper); transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--accent-a); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .info-panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 0; max-height: 55vh; border-radius: 16px 16px 0 0; }
  .legend, .scroll-progress { display: none; }
}
</style>
</head>
<body class="theme-all">

<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="hud top-bar">
  <div class="brand">
    <span class="eyebrow">Logic Inc</span>
    <h1>Market Heatmap</h1>
    <span class="sub">3D Topic Explorer</span>
  </div>
  <div class="controls">
    <button class="btn active" data-arm="all">All</button>
    <button class="btn" data-arm="Agency">Agency</button>
    <button class="btn" data-arm="Pac">Pac</button>
    <a href="../" class="btn">Table view</a>
  </div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="close-btn" id="closePanel">&times;</button>
  <div id="panelContent"></div>
</div>

<div class="legend" id="legend"></div>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="scroll-prompt" id="scrollPrompt">
  <span class="scroll-arrow">&#8595;</span> Scroll to explore topics
</div>

<canvas id="scene"></canvas>

<!-- Scroll runway: one spacer per topic + intro + outro -->
<div class="scroll-runway" id="scrollRunway"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020810, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020810, 0.035);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 16);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 40;
controls.minDistance = 3;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

scene.add(new THREE.AmbientLight(0x1a2035, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

function createSplatTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, 'rgba(255,255,255,0.8)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  grad.addColorStop(0.7, 'rgba(255,255,255,0.05)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const splatTex = createSplatTexture();

function gaussianRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * 0.33 + 0.5;
}

const data = await fetch('data.json').then(r => r.json());

const nodeObjects = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

for (const node of data.nodes) {
  const color = new THREE.Color(node.color);
  const count = Math.max(40, Math.round(node.radius * 350));
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const opacities = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = node.radius * (0.3 + Math.random() * 0.7) * gaussianRandom();
    positions[i * 3]     = Math.sin(phi) * Math.cos(theta) * r;
    positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
    positions[i * 3 + 2] = Math.cos(phi) * r;
    const brightness = 0.6 + Math.random() * 0.4;
    colors[i * 3]     = color.r * brightness;
    colors[i * 3 + 1] = color.g * brightness;
    colors[i * 3 + 2] = color.b * brightness;
    sizes[i] = (0.08 + Math.random() * 0.18) * node.radius * 3;
    opacities[i] = 0.15 + Math.random() * 0.45;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { splatMap: { value: splatTex }, time: { value: 0 }, highlight: { value: 0.0 } },
    vertexShader: `
      attribute float size;
      attribute float opacity;
      varying vec3 vColor;
      varying float vOpacity;
      uniform float time;
      uniform float highlight;
      void main() {
        vColor = color;
        vOpacity = opacity * (0.6 + highlight * 0.4);
        vec3 pos = position;
        float wave = sin(time * 0.5 + position.x * 2.0 + position.y * 3.0) * 0.03;
        pos += normalize(position) * wave;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (200.0 / -mvPos.z) * (1.0 + highlight * 0.3);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D splatMap;
      varying vec3 vColor;
      varying float vOpacity;
      void main() {
        vec2 uv = gl_PointCoord;
        float alpha = texture2D(splatMap, uv).r;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(vColor, alpha * vOpacity);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  });

  const points = new THREE.Points(geo, mat);
  points.position.set(...node.pos);
  points.userData = node;
  nodeGroup.add(points);
  nodeObjects.push(points);

  const glowGeo = new THREE.SphereGeometry(node.radius * 0.12, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(...node.pos);
  glow.userData = { nodeRef: node.id };
  nodeGroup.add(glow);
}

const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const nodeById = {};
for (const obj of nodeObjects) nodeById[obj.userData.id] = obj;

for (const edge of data.edges) {
  const src = nodeById[edge.source];
  const tgt = nodeById[edge.target];
  if (!src || !tgt) continue;
  const a = src.position.clone(), b = tgt.position.clone();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  mid.y += 0.3;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(20));
  const opacity = Math.min(0.35, edge.weight / 3000);
  const lineColor = new THREE.Color(src.userData.color).lerp(new THREE.Color(tgt.userData.color), 0.5);
  const mat = new THREE.LineBasicMaterial({ color: lineColor, transparent: true, opacity, blending: THREE.AdditiveBlending });
  const line = new THREE.Line(geo, mat);
  line.userData = edge;
  edgeGroup.add(line);
}

// Background stars
const starCount = 2000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3]     = (Math.random() - 0.5) * 80;
  starPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 80;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x334466, size: 0.04, transparent: true, opacity: 0.5 })));

// ── Scroll-driven topic tour ──
const sortedNodes = [...data.nodes].sort((a, b) => b.mentions - a.mentions);
const runway = document.getElementById('scrollRunway');
// 1 intro spacer + 1 per topic + 1 outro
for (let i = 0; i < sortedNodes.length + 2; i++) {
  const div = document.createElement('div');
  div.className = 'spacer';
  runway.appendChild(div);
}

// Scroll progress dots
const progressEl = document.getElementById('scrollProgress');
sortedNodes.forEach((node, i) => {
  const dot = document.createElement('div');
  dot.className = 'scroll-dot';
  dot.dataset.index = i;
  const tip = document.createElement('span');
  tip.className = 'tip';
  tip.textContent = node.label.length > 38 ? node.label.slice(0, 36) + '...' : node.label;
  dot.appendChild(tip);
  dot.addEventListener('click', () => {
    const frac = (i + 1) / (sortedNodes.length + 1);
    window.scrollTo({ top: frac * (document.body.scrollHeight - innerHeight), behavior: 'smooth' });
  });
  progressEl.appendChild(dot);
});

let scrollTopicIdx = -1;
let userInteracted = false;
let lastScrollTime = 0;

function updateScrollTour() {
  const scrollFrac = window.scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
  const rawIdx = Math.round(scrollFrac * (sortedNodes.length + 1)) - 1;
  const idx = Math.max(-1, Math.min(sortedNodes.length - 1, rawIdx));

  if (idx !== scrollTopicIdx) {
    scrollTopicIdx = idx;
    controls.autoRotate = idx < 0;
    lastScrollTime = performance.now();

    // Update progress dots
    progressEl.querySelectorAll('.scroll-dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === idx);
    });

    if (idx >= 0 && idx < sortedNodes.length) {
      const node = sortedNodes[idx];
      const obj = nodeObjects.find(o => o.userData.id === node.id);
      if (obj) {
        selectNode(obj, true);
        document.getElementById('scrollPrompt').classList.add('hidden');
      }
    } else {
      deselectNode();
      if (idx < 0) animateCamera(new THREE.Vector3(0, 3, 16), new THREE.Vector3(0, 0, 0));
    }
  }
}

window.addEventListener('scroll', () => {
  updateScrollTour();
}, { passive: true });

// Click interaction
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.5;
const mouse = new THREE.Vector2();
let selectedNode = null;

canvas.addEventListener('click', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeObjects);
  if (intersects.length > 0) {
    userInteracted = true;
    selectNode(intersects[0].object, false);
    controls.autoRotate = false;
  } else {
    deselectNode();
  }
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeObjects);
  canvas.style.cursor = intersects.length > 0 ? 'pointer' : 'grab';
  for (const obj of nodeObjects) {
    const isHovered = intersects.length > 0 && intersects[0].object === obj;
    obj.material.uniforms.highlight.value = THREE.MathUtils.lerp(
      obj.material.uniforms.highlight.value,
      isHovered || (selectedNode === obj) ? 1.0 : 0.0, 0.15
    );
  }
});

function selectNode(obj, fromScroll) {
  selectedNode = obj;
  const node = obj.userData;
  const connections = data.edges.filter(e => e.source === node.id || e.target === node.id)
    .sort((a, b) => b.weight - a.weight).slice(0, 8);
  const nodeQuotes = data.quotes.filter(q =>
    q.arm.toLowerCase() === node.arm.toLowerCase() ||
    node.label.toLowerCase().includes(q.category.toLowerCase()) ||
    q.category.toLowerCase().includes(node.arm.toLowerCase())
  ).slice(0, 3);

  let accentVar = node.arm === 'Pac' ? 'var(--accent-p)' : 'var(--accent-a)';
  let html = `
    <h2>${node.label}</h2>
    <div class="meta">${node.arm} &middot; ${node.parent}</div>
    <div class="stat-row">
      <div class="stat"><strong>${node.mentions.toLocaleString()}</strong><span>Mentions</span></div>
      <div class="stat"><strong>${node.share}%</strong><span>Corpus share</span></div>
    </div>
  `;
  if (connections.length > 0) {
    html += `<div class="connections"><h3 style="font-size:13px;color:${accentVar};margin-bottom:6px;">Connected topics</h3>`;
    for (const conn of connections) {
      const otherId = conn.source === node.id ? conn.target : conn.source;
      const otherNode = data.nodes.find(n => n.id === otherId);
      if (otherNode) html += `<div class="conn-item">${otherNode.label} <span style="float:right;color:${accentVar}">${conn.weight.toLocaleString()}</span></div>`;
    }
    html += `</div>`;
  }
  if (nodeQuotes.length > 0) {
    html += `<h3 style="font-size:13px;color:${accentVar};margin-top:16px;">Related quotes</h3>`;
    for (const q of nodeQuotes) {
      html += `<div class="quote-card"><blockquote>"${q.text}"</blockquote><div class="attr"><strong>${q.speaker}</strong> &middot; ${q.title} &middot; ${q.company}<br>${q.podcast} &middot; <a href="${q.url}" target="_blank" rel="noopener">${q.episode}</a></div></div>`;
    }
  }
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('infoPanel').classList.add('open');

  const target = new THREE.Vector3(...node.pos);
  const offset = new THREE.Vector3(2, 1.5, 3).normalize().multiplyScalar(4);
  animateCamera(target.clone().add(offset), target);
}

function deselectNode() {
  selectedNode = null;
  document.getElementById('infoPanel').classList.remove('open');
  for (const obj of nodeObjects) obj.material.uniforms.highlight.value = 0;
}

document.getElementById('closePanel').addEventListener('click', () => { deselectNode(); userInteracted = true; });

// Camera animation
let cameraAnimation = null;
function animateCamera(targetPos, lookAt) {
  cameraAnimation = {
    startPos: camera.position.clone(), targetPos,
    startLook: controls.target.clone(), lookAt,
    startTime: performance.now(), duration: 1200
  };
}

// ── Arm filter + theming ──
let currentArm = 'all';

function setArm(arm) {
  currentArm = arm;
  document.querySelectorAll('.btn[data-arm]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn[data-arm="${arm}"]`).classList.add('active');

  document.body.className = arm === 'all' ? 'theme-all' : arm === 'Agency' ? 'theme-agency' : 'theme-pac';

  for (const obj of nodeObjects) {
    obj.visible = arm === 'all' || obj.userData.arm === arm;
  }
  for (const line of edgeGroup.children) {
    const src = nodeById[line.userData.source];
    const tgt = nodeById[line.userData.target];
    line.visible = src?.visible && tgt?.visible;
  }

  // Update fog color per theme
  const fogColor = arm === 'Pac' ? 0x0a0806 : 0x020810;
  scene.fog = new THREE.FogExp2(fogColor, 0.035);
  renderer.setClearColor(fogColor, 1);

  deselectNode();
  updateLegend(arm);
}

document.querySelectorAll('.btn[data-arm]').forEach(btn => {
  btn.addEventListener('click', () => setArm(btn.dataset.arm));
});

function updateLegend(arm) {
  const legends = arm === 'Pac' ? {
    'Design & consumer experience': '#e0fd2c',
    'Retail & consumer performance': '#4fc3f7',
    'Materials & sustainability': '#66bb6a',
    'Manufacturing & execution': '#ff7043',
    'Circular systems': '#26c6da',
    'Claims & compliance': '#ab47bc',
  } : arm === 'Agency' ? {
    'Retail & distribution': '#4fc3f7',
    'Manufacturing & suppliers': '#ff7043',
    'Financial & operational': '#e0fd2c',
    'Channel strategy': '#ab47bc',
    'Packaging & compliance': '#66bb6a',
    'Operational technology': '#26c6da',
  } : {
    'Retail ops': '#4fc3f7',
    'Manufacturing': '#ff7043',
    'Finance & control': '#e0fd2c',
    'Design & brand': '#e0fd2c',
    'Materials': '#66bb6a',
    'Circularity': '#26c6da',
    'Channel': '#ab47bc',
  };

  let html = '<h3>Topic families</h3><div class="legend-items">';
  for (const [label, color] of Object.entries(legends)) {
    html += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${label}</div>`;
  }
  html += '</div>';
  document.getElementById('legend').innerHTML = html;
}
updateLegend('all');

// Animation loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const obj of nodeObjects) {
    obj.material.uniforms.time.value = t;
    const base = obj.userData.pos;
    obj.position.y = base[1] + Math.sin(t * 0.3 + base[0]) * 0.08;
  }

  if (cameraAnimation) {
    const { startPos, targetPos, startLook, lookAt, startTime, duration } = cameraAnimation;
    const progress = Math.min(1, (performance.now() - startTime) / duration);
    const ease = 1 - Math.pow(1 - progress, 3);
    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startLook, lookAt, ease);
    if (progress >= 1) cameraAnimation = null;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => document.getElementById('loading').classList.add('done'), 600);
</script>
</body>
</html>
