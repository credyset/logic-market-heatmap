<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Market Heatmap — 3D Topic Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
  --accent-a: #FF600A;
  --accent-p: #E0FD2C;
  --navy: #050D1F;
  --dk: #2A2A2A;
  --muted: #596579;
  --panel: rgba(12, 14, 22, 0.94);
  --line: rgba(80, 100, 140, 0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040608; color: #d8dde8; font: 14px/1.5 Poppins, sans-serif; overflow-x: hidden; }
#three-container { position: fixed; inset: 0; z-index: 0; }
#three-container canvas { display: block; width: 100%; height: 100%; }

/* Scroll runway sits ABOVE the canvas and IS scrollable */
.scroll-runway { position: relative; z-index: 2; pointer-events: none; }
.scroll-runway .spacer { height: 100vh; }

/* HUD overlays */
.hud { position: fixed; z-index: 20; pointer-events: none; }
.hud > * { pointer-events: auto; }

.top-bar {
  top: 0; left: 0; right: 0; padding: 18px 28px;
  display: flex; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(to bottom, rgba(4,6,8,.85) 0%, transparent 100%);
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .eyebrow { font: 600 10px Poppins; letter-spacing: .18em; text-transform: uppercase; transition: color .4s; }
.brand h1 { font: 800 26px/1 Poppins; letter-spacing: -.04em; color: white; }
body.theme-pac .brand h1 { font-family: 'DM Serif Display', serif; font-weight: 400; }
.brand .sub { font: 12px DM Mono; color: var(--muted); margin-top: 2px; }

.controls { display: flex; gap: 8px; align-items: center; }
.btn {
  font: 600 11px Poppins; text-transform: uppercase; letter-spacing: .04em;
  padding: 8px 16px; border-radius: 50px; border: 1px solid var(--line);
  background: var(--panel); color: #c9d1df; cursor: pointer; transition: all .2s;
  text-decoration: none;
}
.btn:hover { border-color: #fff; color: #fff; }
.btn.active { color: #fff; }

body.theme-all .btn.active[data-arm="all"] { background: linear-gradient(135deg, var(--accent-a), var(--accent-p)); border-color: transparent; color: #111; }
body.theme-all .brand .eyebrow { background: linear-gradient(90deg, var(--accent-a), var(--accent-p)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

body.theme-agency .btn.active[data-arm="Agency"] { background: var(--accent-a); border-color: var(--accent-a); color: #fff; }
body.theme-agency .brand .eyebrow { color: var(--accent-a); -webkit-text-fill-color: var(--accent-a); background: none; }

body.theme-pac .btn.active[data-arm="Pac"] { background: var(--accent-p); border-color: var(--accent-p); color: var(--navy); }
body.theme-pac .brand .eyebrow { color: var(--accent-p); -webkit-text-fill-color: var(--accent-p); background: none; }

/* Floating topic tags (CSS2D) — minimal text, no box */
.topic-tag {
  pointer-events: auto;
  cursor: pointer;
  text-align: center;
  transition: opacity .3s;
  font: 500 10px/1.2 DM Mono, monospace;
  letter-spacing: .02em;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgba(0,0,0,.9), 0 0 20px rgba(0,0,0,.6);
}
.topic-tag.agency { color: rgba(255,96,10,.7); }
.topic-tag.pac { color: rgba(224,253,44,.6); }
.topic-tag:hover { opacity: 1 !important; }
.topic-tag:hover.agency { color: #FF600A; text-shadow: 0 0 12px rgba(255,96,10,.4); }
.topic-tag:hover.pac { color: #E0FD2C; text-shadow: 0 0 12px rgba(224,253,44,.3); }
.topic-tag.active { opacity: 1 !important; }
.topic-tag.active.agency { color: #FF600A; }
.topic-tag.active.pac { color: #E0FD2C; }
.topic-tag.dimmed { opacity: 0.08; }
.topic-tag.hidden { display: none; }

/* Info panel */
.info-panel {
  position: fixed; right: 24px; top: 70px; bottom: 24px; width: 380px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(20px); overflow-y: auto; z-index: 25;
  padding: 24px; display: none; flex-direction: column; gap: 14px;
}
.info-panel.open { display: flex; }
.info-panel .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 6px; }
.info-panel .close-btn:hover { color: white; }
.info-panel h2 { font-size: 18px; letter-spacing: -.02em; color: white; padding-right: 30px; }
.info-panel .meta { font: 11px DM Mono; color: var(--muted); }
.info-panel .stat-row { display: flex; gap: 12px; }
.info-panel .stat { flex: 1; background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px; }
.info-panel .stat strong { display: block; font-size: 20px; }
body.theme-all .info-panel .stat strong, body.theme-agency .info-panel .stat strong { color: var(--accent-a); }
body.theme-pac .info-panel .stat strong { color: var(--accent-p); }
.info-panel .stat span { font: 10px DM Mono; color: var(--muted); text-transform: uppercase; }
.info-panel .conn-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); color: #a0aab8; }
.info-panel .quote-card { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 4px; }
.info-panel .quote-card blockquote { font-size: 13px; line-height: 1.5; color: #e0e4ec; margin: 0 0 6px; font-style: italic; }
.info-panel .quote-card .attr { font: 10px DM Mono; color: var(--muted); }
.info-panel .quote-card a { text-decoration: none; }
body.theme-all .info-panel .quote-card a, body.theme-agency .info-panel .quote-card a { color: var(--accent-a); }
body.theme-pac .info-panel .quote-card a { color: var(--accent-p); }

/* Legend */
.legend {
  position: fixed; left: 24px; bottom: 24px; z-index: 20;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 18px; backdrop-filter: blur(15px);
}
.legend h3 { font: 500 10px DM Mono; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
.legend-items { display: flex; flex-direction: column; gap: 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #a0aab8; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Progress rail */
.progress-rail {
  position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
  z-index: 22; display: flex; flex-direction: column; gap: 5px;
  pointer-events: auto;
}
.rail-dot {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18); cursor: pointer; transition: all .25s; position: relative;
}
.rail-dot.active { transform: scale(1.5); }
body.theme-all .rail-dot.active, body.theme-agency .rail-dot.active { background: var(--accent-a); border-color: var(--accent-a); }
body.theme-pac .rail-dot.active { background: var(--accent-p); border-color: var(--accent-p); }
.rail-dot .tip {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font: 500 10px DM Mono; color: #c9d1df; white-space: nowrap; background: var(--panel);
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.rail-dot:hover .tip { opacity: 1; }

/* Current topic label at bottom center */
.current-topic {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 22;
  text-align: center; transition: opacity .4s;
  pointer-events: none;
}
.current-topic.hidden { opacity: 0; }
.current-topic .ct-num { font: 600 10px DM Mono; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.current-topic .ct-title { font: 700 20px/1.2 Poppins; color: white; text-shadow: 0 2px 20px rgba(0,0,0,.8); max-width: 540px; }
body.theme-pac .current-topic .ct-title { font-family: 'DM Serif Display', serif; font-weight: 400; }
.current-topic .ct-meta { font: 12px DM Mono; color: var(--muted); margin-top: 4px; }

/* Scroll prompt */
.scroll-prompt {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 22;
  font: 500 12px Poppins; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 50px; padding: 10px 22px; backdrop-filter: blur(10px);
  transition: opacity .5s; display: flex; align-items: center; gap: 8px;
}
.scroll-prompt.hidden { opacity: 0; pointer-events: none; }
.scroll-arrow { animation: bounce 1.5s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

.loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #040608; transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--accent-a); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .info-panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 0; max-height: 55vh; border-radius: 16px 16px 0 0; }
  .legend, .progress-rail { display: none; }
  .current-topic .ct-title { font-size: 16px; max-width: 80vw; }
}
</style>
</head>
<body class="theme-all">

<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="hud top-bar">
  <div class="brand">
    <span class="eyebrow">Logic Inc</span>
    <h1>Market Heatmap</h1>
    <span class="sub">3D Topic Explorer</span>
  </div>
  <div class="controls">
    <button class="btn active" data-arm="all">All</button>
    <button class="btn" data-arm="Agency">Agency</button>
    <button class="btn" data-arm="Pac">Pac</button>
    <a href="../" class="btn">Table view</a>
  </div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="close-btn" id="closePanel">&times;</button>
  <div id="panelContent"></div>
</div>

<div class="legend" id="legend"></div>
<div class="progress-rail" id="progressRail"></div>

<div class="current-topic hidden" id="currentTopic">
  <div class="ct-num" id="ctNum"></div>
  <div class="ct-title" id="ctTitle"></div>
  <div class="ct-meta" id="ctMeta"></div>
</div>

<div class="scroll-prompt" id="scrollPrompt">
  <span class="scroll-arrow">&#8595;</span> Scroll to explore topics
</div>

<div id="three-container"></div>
<div class="scroll-runway" id="scrollRunway"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const container = document.getElementById('three-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x040608, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040608, 0.022);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 3, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 50;
controls.minDistance = 3;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.enableZoom = true;
// Disable scroll-wheel zoom so scrolling drives the topic tour instead
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
// Remove wheel from orbit controls — we handle it via page scroll
controls.enableZoom = false;

// Bloom post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.85);
composer.addPass(bloom);

// CSS2D label renderer
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.zIndex = '5';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.overflow = 'visible';
document.body.appendChild(labelRenderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x181828, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.25);
dirLight.position.set(5, 12, 7);
scene.add(dirLight);

// Gaussian splat texture
function createSplatTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, 'rgba(255,255,255,0.8)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  grad.addColorStop(0.7, 'rgba(255,255,255,0.05)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const splatTex = createSplatTexture();

function gaussRand() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * 0.33 + 0.5;
}

// Load data
const data = await fetch('data.json').then(r => r.json());

// Build topic clusters
const nodeObjects = [];
const labelObjects = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

for (const node of data.nodes) {
  const color = new THREE.Color(node.color);
  const count = Math.max(50, Math.round(node.radius * 380));
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const opacities = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = node.radius * (0.3 + Math.random() * 0.7) * gaussRand();
    positions[i * 3]     = Math.sin(phi) * Math.cos(theta) * r;
    positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
    positions[i * 3 + 2] = Math.cos(phi) * r;
    const brightness = 0.55 + Math.random() * 0.45;
    colors[i * 3]     = color.r * brightness;
    colors[i * 3 + 1] = color.g * brightness;
    colors[i * 3 + 2] = color.b * brightness;
    sizes[i] = (0.08 + Math.random() * 0.2) * node.radius * 3.2;
    opacities[i] = 0.15 + Math.random() * 0.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { splatMap: { value: splatTex }, time: { value: 0 }, highlight: { value: 0.0 } },
    vertexShader: `
      attribute float size;
      attribute float opacity;
      varying vec3 vColor;
      varying float vOpacity;
      uniform float time;
      uniform float highlight;
      void main() {
        vColor = color;
        vOpacity = opacity * (0.6 + highlight * 0.4);
        vec3 pos = position;
        float wave = sin(time * 0.5 + position.x * 2.0 + position.y * 3.0) * 0.03;
        pos += normalize(position + vec3(0.001)) * wave;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * (200.0 / -mvPos.z) * (1.0 + highlight * 0.3);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D splatMap;
      varying vec3 vColor;
      varying float vOpacity;
      void main() {
        float alpha = texture2D(splatMap, gl_PointCoord).r;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(vColor, alpha * vOpacity);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  });

  const points = new THREE.Points(geo, mat);
  points.position.set(...node.pos);
  points.userData = node;
  nodeGroup.add(points);
  nodeObjects.push(points);

  // Core glow
  const glowGeo = new THREE.SphereGeometry(node.radius * 0.12, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(...node.pos);
  glow.userData = { nodeRef: node.id };
  nodeGroup.add(glow);

  // Minimal floating tag (CSS2D)
  const el = document.createElement('div');
  el.className = 'topic-tag ' + node.arm.toLowerCase();
  el.dataset.arm = node.arm;
  const words = node.label.split(/[,]/)[0].trim();
  const shortLabel = words.length > 28 ? words.slice(0, 26) + '...' : words;
  el.textContent = shortLabel;
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    selectNode(points, false);
    controls.autoRotate = false;
  });
  const labelObj = new CSS2DObject(el);
  labelObj.position.set(node.pos[0], node.pos[1] + node.radius + 0.35, node.pos[2]);
  labelObj.userData = { arm: node.arm, nodeId: node.id };
  scene.add(labelObj);
  labelObjects.push({ obj: labelObj, el, arm: node.arm, nodeId: node.id });
}

// Co-occurrence edges
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const nodeById = {};
for (const obj of nodeObjects) nodeById[obj.userData.id] = obj;

for (const edge of data.edges) {
  const src = nodeById[edge.source];
  const tgt = nodeById[edge.target];
  if (!src || !tgt) continue;
  const a = src.position.clone(), b = tgt.position.clone();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  mid.y += 0.3;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(20));
  const opacity = Math.min(0.3, edge.weight / 3000);
  const lineColor = new THREE.Color(src.userData.color).lerp(new THREE.Color(tgt.userData.color), 0.5);
  edgeGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: lineColor, transparent: true, opacity, blending: THREE.AdditiveBlending
  })));
}

// Dot-rendered enclosure
const bbox = new THREE.Box3();
for (const obj of nodeObjects) bbox.expandByPoint(new THREE.Vector3(...obj.userData.pos));
const center = new THREE.Vector3(); bbox.getCenter(center);
const bsize = new THREE.Vector3(); bbox.getSize(bsize);
const pad = 5;
const hw = bsize.x / 2 + pad, hh = bsize.y / 2 + pad + 2, hd = bsize.z / 2 + pad;
const cx = center.x, cy = center.y, cz = center.z;

function makeStructuralDots(pts, color, ptSize, ptOpacity) {
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(pts.length * 3);
  pts.forEach((p, i) => { arr[i*3] = p[0]; arr[i*3+1] = p[1]; arr[i*3+2] = p[2]; });
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color, size: ptSize, transparent: true, opacity: ptOpacity,
    map: splatTex, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

const structureGroup = new THREE.Group();
scene.add(structureGroup);

// Floor
const floorDots = [];
for (let x = cx-hw; x <= cx+hw; x += 1.2) for (let z = cz-hd; z <= cz+hd; z += 1.2) floorDots.push([x, cy-hh+0.2, z]);
structureGroup.add(makeStructuralDots(floorDots, 0x1a1a2e, 0.06, 0.25));

// Ceiling
const ceilDots = [];
for (let x = cx-hw; x <= cx+hw; x += 2.4) for (let z = cz-hd; z <= cz+hd; z += 2.4) ceilDots.push([x, cy+hh, z]);
structureGroup.add(makeStructuralDots(ceilDots, 0x14142a, 0.05, 0.15));

// Walls
const wallDots = [];
for (let y = cy-hh; y <= cy+hh; y += 1) {
  for (let z = cz-hd; z <= cz+hd; z += 1) { wallDots.push([cx-hw, y, z]); wallDots.push([cx+hw, y, z]); }
  for (let x = cx-hw; x <= cx+hw; x += 1) { wallDots.push([x, y, cz-hd]); wallDots.push([x, y, cz+hd]); }
}
structureGroup.add(makeStructuralDots(wallDots, 0x12122a, 0.04, 0.12));

// Columns
const colDots = [];
for (const [colX, colZ] of [[cx-hw,cz-hd],[cx+hw,cz-hd],[cx-hw,cz+hd],[cx+hw,cz+hd],[cx,cz-hd],[cx,cz+hd],[cx-hw,cz],[cx+hw,cz]]) {
  for (let y = cy-hh; y <= cy+hh; y += 0.3) colDots.push([colX, y, colZ]);
}
structureGroup.add(makeStructuralDots(colDots, 0x2a2a4a, 0.08, 0.3));

// Beams
const beamDots = [];
for (let z = cz-hd; z <= cz+hd; z += 3) for (let x = cx-hw; x <= cx+hw; x += 0.4) beamDots.push([x, cy+hh-0.1, z]);
structureGroup.add(makeStructuralDots(beamDots, 0x20204a, 0.06, 0.2));

// Dust
const dustCount = 4000;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3] = cx + (Math.random()-0.5)*2*hw;
  dustPos[i*3+1] = cy - hh + Math.random()*2*hh;
  dustPos[i*3+2] = cz + (Math.random()-0.5)*2*hd;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x2a2a4a, size: 0.025, transparent: true, opacity: 0.3,
  map: splatTex, blending: THREE.AdditiveBlending, depthWrite: false
})));

// ── Scroll-driven topic tour ──
const sortedNodes = [...data.nodes].sort((a, b) => b.mentions - a.mentions);
const runway = document.getElementById('scrollRunway');
for (let i = 0; i < sortedNodes.length + 2; i++) {
  const div = document.createElement('div');
  div.className = 'spacer';
  runway.appendChild(div);
}

// Progress rail
const railEl = document.getElementById('progressRail');
sortedNodes.forEach((node, i) => {
  const dot = document.createElement('div');
  dot.className = 'rail-dot';
  const tip = document.createElement('span');
  tip.className = 'tip';
  tip.textContent = node.label.length > 36 ? node.label.slice(0, 34) + '…' : node.label;
  dot.appendChild(tip);
  dot.addEventListener('click', () => {
    const frac = (i + 1) / (sortedNodes.length + 1);
    window.scrollTo({ top: frac * (document.body.scrollHeight - innerHeight), behavior: 'smooth' });
  });
  railEl.appendChild(dot);
});

let activeTopicIdx = -1;

const ctEl = document.getElementById('currentTopic');
const ctNum = document.getElementById('ctNum');
const ctTitle = document.getElementById('ctTitle');
const ctMeta = document.getElementById('ctMeta');
const promptEl = document.getElementById('scrollPrompt');

function onScroll() {
  const scrollMax = document.body.scrollHeight - innerHeight;
  if (scrollMax <= 0) return;
  const frac = window.scrollY / scrollMax;
  const rawIdx = Math.round(frac * (sortedNodes.length + 1)) - 1;
  const idx = Math.max(-1, Math.min(sortedNodes.length - 1, rawIdx));

  if (idx !== activeTopicIdx) {
    activeTopicIdx = idx;
    controls.autoRotate = idx < 0;

    railEl.querySelectorAll('.rail-dot').forEach((d, i) => d.classList.toggle('active', i === idx));

    if (idx >= 0) {
      const node = sortedNodes[idx];
      const obj = nodeObjects.find(o => o.userData.id === node.id);
      if (obj) {
        selectNode(obj, true);
        promptEl.classList.add('hidden');

        ctNum.textContent = `Station ${idx + 1} of ${sortedNodes.length}`;
        ctTitle.textContent = node.label;
        ctMeta.textContent = `${node.arm} · ${node.mentions.toLocaleString()} mentions · ${node.share}% share`;
        ctEl.classList.remove('hidden');
      }
    } else {
      deselectNode();
      ctEl.classList.add('hidden');
      animateCamera(new THREE.Vector3(0, 3, 16), new THREE.Vector3(0, 0, 0));
    }
  }
}

window.addEventListener('scroll', onScroll, { passive: true });

// ── Click and hover ──
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.5;
const mouse = new THREE.Vector2();
let selectedNode = null;

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeObjects);
  if (hits.length > 0) {
    selectNode(hits[0].object, false);
    controls.autoRotate = false;
  } else {
    deselectNode();
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeObjects);
  renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
  for (const obj of nodeObjects) {
    const h = hits.length > 0 && hits[0].object === obj;
    obj.material.uniforms.highlight.value = THREE.MathUtils.lerp(
      obj.material.uniforms.highlight.value,
      h || (selectedNode === obj) ? 1.0 : 0.0, 0.15
    );
  }
});

function selectNode(obj, fromScroll) {
  selectedNode = obj;
  const node = obj.userData;
  const connections = data.edges.filter(e => e.source === node.id || e.target === node.id)
    .sort((a, b) => b.weight - a.weight).slice(0, 8);
  const nodeQuotes = data.quotes.filter(q =>
    q.arm.toLowerCase() === node.arm.toLowerCase() ||
    node.label.toLowerCase().includes(q.category.toLowerCase()) ||
    q.category.toLowerCase().includes(node.arm.toLowerCase())
  ).slice(0, 3);

  const accentVar = node.arm === 'Pac' ? 'var(--accent-p)' : 'var(--accent-a)';
  let html = `
    <h2>${node.label}</h2>
    <div class="meta">${node.arm} &middot; ${node.parent}</div>
    <div class="stat-row">
      <div class="stat"><strong>${node.mentions.toLocaleString()}</strong><span>Mentions</span></div>
      <div class="stat"><strong>${node.share}%</strong><span>Corpus share</span></div>
    </div>
  `;
  if (connections.length > 0) {
    html += `<div class="connections"><h3 style="font-size:13px;color:${accentVar};margin-bottom:6px;">Connected topics</h3>`;
    for (const conn of connections) {
      const otherId = conn.source === node.id ? conn.target : conn.source;
      const other = data.nodes.find(n => n.id === otherId);
      if (other) html += `<div class="conn-item">${other.label} <span style="float:right;color:${accentVar}">${conn.weight.toLocaleString()}</span></div>`;
    }
    html += `</div>`;
  }
  if (nodeQuotes.length > 0) {
    html += `<h3 style="font-size:13px;color:${accentVar};margin-top:16px;">Related quotes</h3>`;
    for (const q of nodeQuotes) {
      html += `<div class="quote-card"><blockquote>&ldquo;${q.text}&rdquo;</blockquote><div class="attr"><strong>${q.speaker}</strong> &middot; ${q.title} &middot; ${q.company}<br>${q.podcast} &middot; <a href="${q.url}" target="_blank" rel="noopener">${q.episode}</a></div></div>`;
    }
  }
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('infoPanel').classList.add('open');

  // Dim non-selected labels, highlight active
  for (const lo of labelObjects) {
    lo.el.classList.toggle('dimmed', lo.nodeId !== node.id);
    lo.el.classList.toggle('active', lo.nodeId === node.id);
  }

  const target = new THREE.Vector3(...node.pos);
  const offset = new THREE.Vector3(2, 1.5, 3).normalize().multiplyScalar(4);
  animateCamera(target.clone().add(offset), target);
}

function deselectNode() {
  selectedNode = null;
  document.getElementById('infoPanel').classList.remove('open');
  for (const obj of nodeObjects) obj.material.uniforms.highlight.value = 0;
  for (const lo of labelObjects) { lo.el.classList.remove('dimmed'); lo.el.classList.remove('active'); }
}

document.getElementById('closePanel').addEventListener('click', deselectNode);

// Camera animation
let cameraAnimation = null;
function animateCamera(targetPos, lookAt) {
  cameraAnimation = {
    startPos: camera.position.clone(), targetPos,
    startLook: controls.target.clone(), lookAt,
    startTime: performance.now(), duration: 1200
  };
}

// ── Arm filter + theming ──
let currentArm = 'all';

function setArm(arm) {
  currentArm = arm;
  document.querySelectorAll('.btn[data-arm]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn[data-arm="${arm}"]`).classList.add('active');
  document.body.className = arm === 'all' ? 'theme-all' : arm === 'Agency' ? 'theme-agency' : 'theme-pac';

  for (const obj of nodeObjects) {
    obj.visible = arm === 'all' || obj.userData.arm === arm;
  }
  for (const lo of labelObjects) {
    const show = arm === 'all' || lo.arm === arm;
    lo.el.classList.toggle('hidden', !show);
    lo.obj.visible = show;
  }
  for (const line of edgeGroup.children) {
    const src = nodeById[line.userData.source];
    const tgt = nodeById[line.userData.target];
    line.visible = (src ? src.visible : false) && (tgt ? tgt.visible : false);
  }

  const fogColor = arm === 'Agency' ? 0x0c0806 : arm === 'Pac' ? 0x030a08 : 0x040608;
  scene.fog = new THREE.FogExp2(fogColor, 0.022);
  renderer.setClearColor(fogColor, 1);

  const tint = arm === 'Agency' ? 0x1a1008 : arm === 'Pac' ? 0x0a1a0c : 0x1a1a2e;
  structureGroup.traverse(child => {
    if (child.isPoints && child.material.color) child.material.color.set(tint);
  });

  deselectNode();
  updateLegend(arm);
}

document.querySelectorAll('.btn[data-arm]').forEach(btn => {
  btn.addEventListener('click', () => setArm(btn.dataset.arm));
});

function updateLegend(arm) {
  const legends = arm === 'Pac' ? {
    'Design & consumer experience': '#E0FD2C',
    'Retail & consumer performance': '#C8E820',
    'Materials & sustainability': '#66BB6A',
    'Manufacturing & execution': '#D4E87A',
    'Circular systems': '#26C6DA',
    'Claims & compliance': '#B8C0D0',
  } : arm === 'Agency' ? {
    'Retail & distribution': '#FF600A',
    'Manufacturing & suppliers': '#FF8A50',
    'Financial & operational': '#FFB74D',
    'Channel strategy': '#E55509',
    'Packaging & compliance': '#FF7043',
    'Operational technology': '#0055FF',
  } : {
    'Agency — Retail ops': '#FF600A',
    'Agency — Manufacturing': '#FF8A50',
    'Agency — Finance': '#FFB74D',
    'Pac — Design & brand': '#E0FD2C',
    'Pac — Materials': '#66BB6A',
    'Pac — Retail fit': '#C8E820',
  };
  let html = '<h3>Topic families</h3><div class="legend-items">';
  for (const [label, color] of Object.entries(legends)) {
    html += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${label}</div>`;
  }
  html += '</div>';
  document.getElementById('legend').innerHTML = html;
}
updateLegend('all');

// ── Animation loop ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const obj of nodeObjects) {
    obj.material.uniforms.time.value = t;
    const base = obj.userData.pos;
    obj.position.y = base[1] + Math.sin(t * 0.3 + base[0]) * 0.08;
  }

  const dAttr = dustGeo.getAttribute('position');
  for (let i = 0; i < dustCount; i++) {
    dAttr.array[i*3+1] += Math.sin(t * 0.2 + i * 0.1) * 0.0003;
    if (dAttr.array[i*3+1] > cy + hh) dAttr.array[i*3+1] = cy - hh;
  }
  dAttr.needsUpdate = true;

  if (cameraAnimation) {
    const { startPos, targetPos, startLook, lookAt, startTime, duration } = cameraAnimation;
    const progress = Math.min(1, (performance.now() - startTime) / duration);
    const ease = 1 - Math.pow(1 - progress, 3);
    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startLook, lookAt, ease);
    if (progress >= 1) cameraAnimation = null;
  }

  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => document.getElementById('loading').classList.add('done'), 600);
</script>
</body>
</html>
